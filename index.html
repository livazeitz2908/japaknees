/* =========================================================
   Kalenderspiel – Monate und Wochentage sortieren
   Route: calendar-game

   Idee:
   - Monate oder Wochentage werden gemischt.
   - Der Nutzer bringt sie in die richtige Reihenfolge.
   - Karten werden durch Antippen getauscht.
   - Zusätzlich gibt es Hoch-/Runter-Buttons für feines Sortieren.
   ========================================================= */

function renderCalendarGame(mount) {
  const CALENDAR_DATA = {
    months: {
      title: "Monate",
      hint: "Bringe die Monate von Januar bis Dezember in die richtige Reihenfolge.",
      items: [
        { jp: "1月", reading: "いちがつ", de: "Januar" },
        { jp: "2月", reading: "にがつ", de: "Februar" },
        { jp: "3月", reading: "さんがつ", de: "März" },
        { jp: "4月", reading: "しがつ", de: "April" },
        { jp: "5月", reading: "ごがつ", de: "Mai" },
        { jp: "6月", reading: "ろくがつ", de: "Juni" },
        { jp: "7月", reading: "しちがつ", de: "Juli" },
        { jp: "8月", reading: "はちがつ", de: "August" },
        { jp: "9月", reading: "くがつ", de: "September" },
        { jp: "10月", reading: "じゅうがつ", de: "Oktober" },
        { jp: "11月", reading: "じゅういちがつ", de: "November" },
        { jp: "12月", reading: "じゅうにがつ", de: "Dezember" }
      ]
    },

    weekdays: {
      title: "Wochentage",
      hint: "Bringe die Wochentage von Montag bis Sonntag in die richtige Reihenfolge.",
      items: [
        { jp: "月曜日", reading: "げつようび", de: "Montag" },
        { jp: "火曜日", reading: "かようび", de: "Dienstag" },
        { jp: "水曜日", reading: "すいようび", de: "Mittwoch" },
        { jp: "木曜日", reading: "もくようび", de: "Donnerstag" },
        { jp: "金曜日", reading: "きんようび", de: "Freitag" },
        { jp: "土曜日", reading: "どようび", de: "Samstag" },
        { jp: "日曜日", reading: "にちようび", de: "Sonntag" }
      ]
    }
  };

  const game = {
  mode: "months",
  order: [],
  selectedIndex: null,
  checked: false,
  score: 0,
  rounds: 0,
  feedback: "",
  visibleTranslations: new Set()
};

  function setupRound(mode = game.mode) {
  game.mode = mode;
  game.order = shuffle(
    CALENDAR_DATA[game.mode].items.map((item, index) => ({
      ...item,
      correctIndex: index
    }))
  );

  game.selectedIndex = null;
  game.checked = false;
  game.feedback = "";
  game.visibleTranslations = new Set();

  if (isCorrectOrder() && game.order.length > 1) {
    game.order = shuffle(game.order);
  }

  redraw();
}

  function isCorrectOrder() {
    return game.order.every((item, index) => item.correctIndex === index);
  }

  function swapItems(a, b) {
    const temp = game.order[a];
    game.order[a] = game.order[b];
    game.order[b] = temp;
  }

  function selectCard(index) {
    if (game.checked) {
      game.checked = false;
      game.feedback = "";
    }

    if (game.selectedIndex === null) {
      game.selectedIndex = index;
      redraw();
      return;
    }

    if (game.selectedIndex === index) {
      game.selectedIndex = null;
      redraw();
      return;
    }

    swapItems(game.selectedIndex, index);
    game.selectedIndex = null;
    redraw();
  }

  function moveItem(index, direction) {
    const nextIndex = index + direction;

    if (nextIndex < 0 || nextIndex >= game.order.length) return;

    if (game.checked) {
      game.checked = false;
      game.feedback = "";
    }

    swapItems(index, nextIndex);
    game.selectedIndex = null;
    redraw();
  }

  function toggleTranslation(index) {
  const item = game.order[index];
  if (!item) return;

  const key = item.correctIndex;

  if (game.visibleTranslations.has(key)) {
    game.visibleTranslations.delete(key);
  } else {
    game.visibleTranslations.add(key);
  }

  redraw();
}

  function checkOrder() {
    game.checked = true;
    game.rounds++;

    if (isCorrectOrder()) {
      game.score++;
      game.feedback = "Richtig! Die Reihenfolge stimmt.";
    } else {
      game.feedback = "Noch nicht ganz. Tausche die Karten weiter.";
    }

    redraw();
  }

  function revealOrder() {
    game.order = CALENDAR_DATA[game.mode].items.map((item, index) => ({
      ...item,
      correctIndex: index
    }));

    game.selectedIndex = null;
    game.checked = true;
    game.feedback = "Das ist die richtige Reihenfolge.";
    redraw();
  }

  function speakCalendarItem(item) {
    if (!item) return;

    try {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }

      if (typeof speak === "function") {
        speak(item.reading || item.jp);
        return;
      }

      const u = new SpeechSynthesisUtterance(item.reading || item.jp);
      u.lang = "ja-JP";
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function redraw() {
    const data = CALENDAR_DATA[game.mode];
    const feedbackClass = game.feedback.startsWith("Richtig") ? "ok" : "bad";

    mount.innerHTML = `
      <section class="calendar-game">
        <div class="calendar-game-head">
          <div>
            <h2>Kalenderspiel</h2>
            <p class="hint">${escapeHTML(data.hint)}</p>
          </div>

          <div class="calendar-score">
            ${game.score} / ${game.rounds}
          </div>
        </div>

        <div class="card calendar-mode-card">
          <button
            type="button"
            id="calendarMonthsBtn"
            class="calendar-mode-btn ${game.mode === "months" ? "active" : ""}"
          >
            Monate
          </button>

          <button
            type="button"
            id="calendarWeekdaysBtn"
            class="calendar-mode-btn ${game.mode === "weekdays" ? "active" : ""}"
          >
            Wochentage
          </button>
        </div>

        <div class="card">
          <h3>${escapeHTML(data.title)} sortieren</h3>

          <div class="calendar-board">
            ${game.order.map((item, index) => {
              const isSelected = game.selectedIndex === index;
              const isCorrect = game.checked && item.correctIndex === index;

              return `
                <div
                  class="calendar-card ${isSelected ? "selected" : ""} ${isCorrect ? "correct" : ""}"
                  data-index="${index}"
                >
                  <div class="calendar-pos">
                    ${index + 1}
                  </div>

                  <div class="calendar-main">
                    <div class="calendar-jp">
                      ${escapeHTML(item.jp)}
                    </div>

                    <div class="calendar-reading">
  ${escapeHTML(item.reading)}
</div>

${game.visibleTranslations.has(item.correctIndex) ? `
  <div class="calendar-de">
    Deutsch: ${escapeHTML(item.de)}
  </div>
` : ""}
                  </div>

                  <div class="calendar-move-actions">
                    <button
                      type="button"
                      class="calendar-move"
                      data-action="up"
                      data-index="${index}"
                      title="Nach oben"
                      ${index === 0 ? "disabled" : ""}
                    >
                      ↑
                    </button>

                    <button
                      type="button"
                      class="calendar-move"
                      data-action="down"
                      data-index="${index}"
                      title="Nach unten"
                      ${index === game.order.length - 1 ? "disabled" : ""}
                    >
                      ↓
                    </button>

                    <button
                      type="button"
                      class="calendar-move"
                      data-action="speak"
                      data-index="${index}"
                      title="Anhören"
                    >
                      🔊
                    </button>

                    <button
  type="button"
  class="calendar-move calendar-translation-btn ${game.visibleTranslations.has(item.correctIndex) ? "active" : ""}"
  data-action="translation"
  data-index="${index}"
  title="Deutsche Übersetzung anzeigen"
>
  DE
</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="calendar-feedback ${feedbackClass}">
            ${game.feedback ? escapeHTML(game.feedback) : ""}
          </div>

          <div class="calendar-actions">
            <button id="calendarCheckBtn" class="primary" type="button">
              Prüfen
            </button>

            <button id="calendarShuffleBtn" type="button">
              Neu mischen
            </button>

            <button id="calendarRevealBtn" type="button">
              Lösung zeigen
            </button>

            <button onclick="goto('home')" type="button">
              Zurück
            </button>
          </div>

          <p class="calendar-help">
            Tipp: Tippe eine Karte an und danach eine zweite Karte. Beide werden getauscht.
          </p>
        </div>
      </section>
    `;

    mount.querySelector("#calendarMonthsBtn").onclick = () => {
      if (game.mode !== "months") setupRound("months");
    };

    mount.querySelector("#calendarWeekdaysBtn").onclick = () => {
      if (game.mode !== "weekdays") setupRound("weekdays");
    };

    mount.querySelectorAll(".calendar-card").forEach(card => {
      card.addEventListener("click", () => {
        selectCard(Number(card.dataset.index));
      });
    });

    mount.querySelectorAll(".calendar-move").forEach(btn => {
      btn.addEventListener("click", (event) => {
        event.stopPropagation();

        const index = Number(btn.dataset.index);
        const action = btn.dataset.action;

        if (action === "up") {
          moveItem(index, -1);
        }

        if (action === "down") {
          moveItem(index, 1);
        }

        if (action === "speak") {
          speakCalendarItem(game.order[index]);
        }

        if (action === "translation") {
  toggleTranslation(index);
}
      });
    });

    mount.querySelector("#calendarCheckBtn").onclick = () => {
      checkOrder();
    };

    mount.querySelector("#calendarShuffleBtn").onclick = () => {
      setupRound(game.mode);
    };

    mount.querySelector("#calendarRevealBtn").onclick = () => {
      revealOrder();
    };
  }

  setupRound("months");
}


// --- TTS Helpers (Flashcards) ---
function detectLang(t){
  const s = String(t||"");
  if (/[ぁ-んァ-ン一-龯]/.test(s)) return "ja-JP";
  if (/[äöüÄÖÜß]/.test(s) || /\b(und|oder|Bitte|Danke|Hallo|Tschüss|Auf Wiedersehen)\b/i.test(s)) return "de-DE";
  // fallback: simple heuristic
  return /[a-zA-Z]/.test(s) ? "en-US" : "ja-JP";
}
function speak(t){
  if (!('speechSynthesis' in window) || !t) return;
  try {
    const u = new SpeechSynthesisUtterance(String(t));
    u.lang = detectLang(t);
    speechSynthesis.speak(u);
  } catch(e){}
}

// einfache Normalisierung japanischer Texte für den Vergleich
function normalizeJa(str){
  return String(str || "")
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/[！？!?.。､、〜～\-—–'"「」『』（）()［］\[\]]/g, "");
}

// prüft, ob gesprochener Text „nah genug“ an der Zielphrase ist
function spokenMatchesExpected(spoken, expected){
  if (!spoken || !expected) return false;
  const s = normalizeJa(spoken);
  const e = normalizeJa(expected);
  if (!s || !e) return false;
  // „nah genug“, wenn einer den anderen enthält
  return s.includes(e) || e.includes(s);
}



/* -------- Buchstabieren (DE -> Fremdsprache) -------- */
function renderSpell(mount, setId) {
  const s = state.sets.find(x => x.id === setId);
  if (!s || !s.cards.length) { mount.innerHTML = `<p>Keine Karten.</p>`; return; }

  const pool = s.cards.filter(c => isSpellingCandidate(c));
  if (!pool.length) { mount.innerHTML = `<p>Dieses Set enthält keine passenden Vokabelkarten für die Buchstabierfunktion.</p>`; return; }

  const originalOrder = shuffle(pool);
  let order = originalOrder.slice();
  let i = 0;
  let tries = 0;
  let phase = "main";
  let forcedRomaji = false;

  const mistakesMain = new Map();
  const keyOf = (c) => c.id || c.question;
  const incMistake = (c) => {
    if (phase !== "main") return;
    const k = keyOf(c);
    mistakesMain.set(k, (mistakesMain.get(k) || 0) + 1);
  };
  const getMistakes = (c) => mistakesMain.get(keyOf(c)) || 0;

  function finishPhase() {
    if (phase === "main") {
      const problems = originalOrder.filter(c => getMistakes(c) >= 2);
      if (problems.length) {
        phase = "review";
        order = problems.slice();
        i = 0; tries = 0;
        redraw(); return;
      }
      return showStats();
    } else {
      return showStats();
    }
  }

  function showStats() {
    const total = originalOrder.length;
    let correct = 0, wrong = 0;
    originalOrder.forEach(c => (getMistakes(c) === 0 ? (correct++) : (wrong++)));
    const problems = originalOrder
      .map(c => ({ card: c, m: getMistakes(c) }))
      .filter(x => x.m >= 2);
    if (wrong === 0 && total > 0) { try { addProgressIfFlawless(1); } catch (e) { } }

    mount.innerHTML = `
      <h2>Ergebnis – Buchstabieren</h2>
      <div class="card">
        <p>Richtig (ohne Fehler): <strong>${correct}</strong> / ${total}</p>
        <p>Falsch bzw. mit Fehlern: <strong>${wrong}</strong> / ${total}</p>
      </div>
      ${problems.length ? `
        <div class="card">
          <h3>Problemkinder (≥ 2 Fehler im Hauptdurchlauf)</h3>
          <ul>
            ${problems.map(({ card, m }) => {
              const lab = extractJaScriptFromQuestion(card.question);
              const badge = lab ? `<span class="badge">${lab}</span>` : "";
              return `<li>${escapeHTML(card.question)} ${badge} – Fehler: ${m}</li>`;
            }).join("")}
          </ul>
        </div>
      ` : ``}
      <div class="actions">
        <button class="primary" onclick="goto('spell/${s.id}')">Nochmal</button>
        <button onclick="goto('set/${s.id}')">Zum Set</button>
        <button onclick="goto('home')">Start</button>
      </div>
    `;
  }

  function redraw() {
    if (i >= order.length) return finishPhase();
    const c = order[i];
    const { prompt, expected } = getPromptAndExpected(c);
    const scriptLabel = extractJaScriptFromQuestion(c.question);
    const romajiVariant = findRomajiVariant(c, s);
    const currExpected = (forcedRomaji && romajiVariant) ? romajiVariant.answer : expected;
    const currScript = (forcedRomaji && romajiVariant)
      ? 'romaji'
      : (scriptLabel ? scriptLabel.toLowerCase() : null);

    mount.innerHTML = `
      <h2>Buchstabieren: ${escapeHTML(s.name)} ${phase === "review" ? '<span class="badge">Mini-Wiederholung</span>' : ''}</h2>
      <div class="card">
        <div><strong>Bedeutung (DE):</strong> ${escapeHTML(prompt)}</div>
        ${(currScript && currScript !== 'romaji') ? `<div class="hint">Schrift: <span class="badge">${scriptLabel}</span></div>` : ``}
        ${(currScript === 'romaji') ? `<div class="hint">Schrift: <span class="badge">Romaji (umgestellt)</span></div>` : ``}
        <input id="spellInput" class="spell-input"
          placeholder="Antwort ${currScript ? `(${currScript === 'romaji' ? 'Romaji' : scriptLabel})` : ''}"
          autocomplete="off" />
        <div class="hint">3 Versuche pro Wort. Wörter mit ≥ 2 Fehlern werden am Ende nochmals abgefragt.</div>
        <div style="margin-top:.5rem;">Aktuelles Wort: ${i + 1} / ${order.length} | Phase: ${phase === 'main' ? 'Hauptdurchlauf' : 'Mini-Wiederholung'}</div>
      </div>
      <div class="actions">
        <button id="checkBtn" class="primary">Prüfen</button>
        <button id="skipBtn">Überspringen</button>
        ${(scriptLabel && scriptLabel !== 'Romaji' && romajiVariant)
          ? `<button id="romajiBtn" title="Diese Karte in Romaji beantworten">Auf Romaji umstellen</button>`
          : ``}
        <button onclick="goto('set/${s.id}')">Zurück</button>
      </div>
      <div id="write-container"></div>
    `;


 if (!document.getElementById("writeCanvas")) {
    const container = document.getElementById("write-container");
    container.innerHTML = `
      <section class="write-pad" style="margin-top:1rem;">
        <div class="write-pad-controls">
          <button id="wp-kana" type="button">Kana</button>
          <button id="wp-kanji" type="button">Kanji</button>
          <button id="wp-undo" type="button">Undo</button>

          <label for="wp-width" class="sr-only">Strichbreite</label>

        </div>

          <canvas id="writeCanvas"></canvas>
          <div id="writeHint" aria-hidden="true"></div>
        </div>
        <span id="wp-current-kana" hidden></span>
        <span id="wp-current-kanji" hidden></span>
      </section>
    `;



    
 document.getElementById("wp-current-kana").textContent  = c.kana || "";
    document.getElementById("wp-current-kanji").textContent = c.kanji || "";
    setupWritingPad(); // <— siehe JS unten
}

    // Schreibübung initialisieren
    setTimeout(() => {
      if (window.WritingPractice) {
        WritingPractice.setVocab({ kana: c.kana, kanji: c.kanji });
      }
    }, 0);

    $("#spellInput").focus();
    $("#checkBtn").onclick = () => {
      const val = $("#spellInput").value.trim();
      const ok = currScript
        ? equalsJaByScript(val, currExpected, currScript)
        : (normalize(val) === normalize(currExpected));

      if (ok) { i++; tries = 0; forcedRomaji = false; redraw(); }
      else {
        tries++; incMistake(c);
        if (tries >= 3) {
          alert(`Gesucht war: ${currExpected}`);
          i++; tries = 0; forcedRomaji = false; redraw();
        } else {
          alert(`Leider falsch. Versuch ${tries}/3.`);
          $("#spellInput").focus();
        }
      }
    };
    $("#skipBtn").onclick = () => { i++; tries = 0; forcedRomaji = false; redraw(); };
    const rb = $("#romajiBtn");
    if (rb) rb.onclick = () => { forcedRomaji = true; redraw(); };
  }

  redraw();
}



// Sucht im selben Set eine Romaji-Variante zur gleichen DE-Grundlage
function findRomajiVariant(card, set){
  const m = /^(.+)\s+–\s+\((Kana|Kanji|Romaji)\)$/.exec(String(card.question||""));
  if (!m) return null;
  const de = m[1];
  return set.cards.find(cc => cc !== card && cc.question === `${de} – (Romaji)` ) || null;
}



// --- Helpers für JP-Schrift ---
function extractJaScriptFromQuestion(q){
  const m = /^.+\s+–\s+\((Kana|Kanji|Romaji)\)$/.exec(String(q||""));
  return m ? m[1] : null;
}
function kataToHira(str){
  return String(str).replace(/[\u30A1-\u30F6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function normalizeRomaji(str){
  return String(str)
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0304\u0306\u0302]/g,'')
    .replace(/[\s\-]/g,'');
}
function normalizeKana(str){
  return kataToHira(String(str)).replace(/\s+/g,'');
}
function equalsJaByScript(user, expected, script){
  if (script === 'romaji') return normalizeRomaji(user) === normalizeRomaji(expected);
  if (script === 'kana')   return normalizeKana(user) === normalizeKana(expected);
  return String(user).replace(/\s+/g,'') === String(expected).replace(/\s+/g,'');
}

// Heuristik: Karte ist tauglich, wenn DE auf der Frage steht (unser JP‑Seed) ODER die Antwort deutsch aussieht (Englisch‑Seed)
function isSpellingCandidate(c){
  if (/^.+\s+–\s+\((Kana|Kanji|Romaji)\)$/.test(c.question)) return true; // JP Seeds
  return isLikelyGerman(c.answer) && !isLikelyGerman(c.question); // z.B. Hello -> Hallo
}
function getPromptAndExpected(c){
  if (/^(.+)\s+–\s+\((Kana|Kanji|Romaji)\)$/.test(c.question)) {
    const de = c.question.replace(/\s+–\s+\((?:Kana|Kanji|Romaji)\)$/, "");
    return { prompt: de, expected: c.answer };
  }
  // sonst DE ist die Antwort
  return { prompt: c.answer, expected: c.question };
}
function isLikelyGerman(text){
  return /[äöüÄÖÜß]/.test(text) || /\b(und|oder|Hallo|Danke|Bitte|Auf|Wiedersehen|Freund|Entschuldigung)\b/i.test(text);
}
function normalize(s){
  return String(s).trim().replace(/\s+/g," ").toLowerCase();
}

// Utility
function escapeHTML(str){
  return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

          }
        });
        if (cards.length) allSets.push({ id: sheet.toLowerCase().replace(/[^\w]+/g,"-")+"-"+Date.now(), name: sheet, cards, createdAt: Date.now(), updatedAt: Date.now() });
      });
      if (!allSets.length) throw new Error("Keine verwertbaren Spalten gefunden.");
      state.sets.push(...allSets); save(); render(); alert(`Importiert: ${allSets.length} Set(s).`);
    } else if (/\.csv$/i.test(file.name)) {
      const text = await file.text();
      const rows = text.split(/\r?\n/).map(l=>l.split(","));
      const header = rows.shift().map(h=>h.trim().toLowerCase());
      const idx = (k)=> header.indexOf(k);
      const cards = [];
      rows.forEach(r => {
        if (idx("de")>-1 && (idx("kana")>-1 || idx("kanji")>-1 || idx("romaji")>-1)) {
          const de = r[idx("de")]||"";
          if (r[idx("kana")])   cards.push({ id: crypto.randomUUID(), question: `${de} – (Kana)`,  answer: r[idx("kana")] });
          if (r[idx("kanji")])  cards.push({ id: crypto.randomUUID(), question: `${de} – (Kanji)`, answer: r[idx("kanji")] });
          if (r[idx("romaji")]) cards.push({ id: crypto.randomUUID(), question: `${de} – (Romaji)`,answer: r[idx("romaji")] });
        } else if (idx("question")>-1 && idx("answer")>-1) {
          cards.push({ id: crypto.randomUUID(), question: r[idx("question")], answer: r[idx("answer")] });
        }
      });
      if (!cards.length) throw new Error("CSV enthielt keine passenden Spalten.");
      const name = (prompt("Name für das neue Set:", "Import (CSV)") || "Import (CSV)").trim();
      state.sets.push({ id: name.toLowerCase().replace(/[^\w]+/g,"-")+"-"+Date.now(), name, cards, createdAt: Date.now(), updatedAt: Date.now() });
      save(); render(); alert(`Importiert: ${cards.length} Karten.`);
    } else {
      const text = await file.text();

       const data = JSON.parse(text);
      const existing = Array.isArray(state.sets) ? state.sets : [];
      const now = Date.now();

      if (Array.isArray(data)) {
        // ✅ Sets importieren (wie bisher)
        const incoming = data.filter(x => x && x.id && x.name && Array.isArray(x.cards));
        const byId = new Map(existing.map(s => [s.id, s]));
        incoming.forEach(s => { if (!byId.has(s.id)) byId.set(s.id, s); });
        state.sets = [...byId.values()];
        save(); render();
        alert(`Import erfolgreich ✔ (hinzugefügt: ${incoming.length})`);

      } else if (data && typeof data === "object" && Array.isArray(data.grammar)) {
        // 🆕 Grammatik importieren: erwartet { grammar: [...] }
        const incomingG = data.grammar.filter(g => g && g.id && g.title);
        incomingG.forEach(g => {
          if (!g.createdAt) g.createdAt = now;
          if (!g.updatedAt) g.updatedAt = now;
        });
        const prev = Array.isArray(loadGrammar()) ? loadGrammar() : [];
        const map = new Map(prev.map(x => [String(x.id), x]));
        incomingG.forEach(x => map.set(String(x.id), x)); // merge by id (replace/update)
        saveGrammar([...map.values()]);
        render();
        alert(`Grammatik importiert ✔ (${incomingG.length} Einträge)`);

      } else if (data && typeof data === "object" && Array.isArray(data.chats)) {
        // 🆕 Dialog-Chats importieren: erwartet { chats: [ { level, threads:[...] }, ... ] }
        const incomingC = data.chats.filter(l =>
          l &&
          typeof l.level !== "undefined" &&
          Array.isArray(l.threads)
        );

        const prevChats = Array.isArray(loadChats()) ? loadChats() : [];
        const byLevel = new Map(prevChats.map(l => [Number(l.level), l]));

        incomingC.forEach(lv => {
          const lvNum = Number(lv.level);
          const curr = byLevel.get(lvNum) || { level: lvNum, threads: [] };
          const byId = new Map((curr.threads || []).map(t => [t.id, t]));

          (lv.threads || []).forEach(t => {
            if (!t || !t.id) return;
            // eingehende Threads ersetzen vorhandene gleichen id
            byId.set(String(t.id), t);
          });

          curr.threads = [...byId.values()];
          byLevel.set(lvNum, curr);
        });

        saveChats([...byLevel.values()]);
        render();
        alert(`Chats importiert ✔ (${incomingC.length} Level-Einträge)`);
      } else {
        throw new Error("Ungültiges JSON-Format: Array von Sets oder {grammar:[...]} erwartet.");
      }
    }
  } catch (err) { alert("Import fehlgeschlagen: " + err.message); }
  finally { e.target.value = ""; }
});

// Nimmt ein JSON im Format [{de,kana,kanji,romaji}] oder [{question,answer}] entgegen
function absorbGenkiJSON(json){
  let added = 0;
  const name = "Genki – 3rd Ed (Import)";
  const setId = "genki-3rd-import";
  let set = state.sets.find(s => s.id === setId);
  if (!set) { set = { id: setId, name, cards: [], createdAt: Date.now(), updatedAt: Date.now() }; state.sets.push(set); }
  const pushCard = (q,a)=>{ set.cards.push({ id: crypto.randomUUID(), question:q, answer:a }); added++; };

  if (Array.isArray(json)) {
    json.forEach(r => {
      if (r.de && (r.kana || r.kanji || r.romaji)) {
        if (r.kana)  pushCard(`${r.de} – (Kana)`,  String(r.kana));
        if (r.kanji) pushCard(`${r.de} – (Kanji)`, String(r.kanji));
        if (r.romaji)pushCard(`${r.de} – (Romaji)`,String(r.romaji));
      } else if (r.question && r.answer) {
        pushCard(String(r.question), String(r.answer));
      }
    });
  } else if (json && typeof json === "object" && Array.isArray(json.words)) {
    json.words.forEach(w => {
      if (w.de && (w.kana || w.kanji || w.romaji)) {
        if (w.kana)  pushCard(`${w.de} – (Kana)`,  String(w.kana));
        if (w.kanji) pushCard(`${w.de} – (Kanji)`, String(w.kanji));
        if (w.romaji)pushCard(`${w.de} – (Romaji)`,String(w.romaji));
      }
    });
  }
  set.updatedAt = Date.now();
  return added;
}

function toKata(str){
  return [...String(str)].map(ch => {
    const c = ch.codePointAt(0);
    return (c >= 0x3041 && c <= 0x3096) ? String.fromCodePoint(c + 0x60) : ch;
  }).join("");
}

function kanaGroupTitle(script, g){

// ---------- Kana-Fortschritt ----------
function kanaKey(script, gid){ return script + "-" + gid; }
function isKanaPassed(script, gid){
  const k = (loadPath().kana || {})[kanaKey(script, gid)];
  return !!(k && k.passed);
}
function kanaBest(script, gid){
  const k = (loadPath().kana || {})[kanaKey(script, gid)];
  return k ? (k.best || 0) : null;
}
function kanaStats(script){
  const groups = KANA[script].groups;
  const passed = groups.filter(g => isKanaPassed(script, g.id)).length;
  return { passed, total: groups.length };
}
function hiraBasicDone(){
  for (let i = 1; i <= 10; i++) if (!isKanaPassed("hiragana", i)) return false;
  return true;
}
function kataUnlocked(){
  return hiraBasicDone() || !!loadPath().forceKata;
}
function isKanaOpen(script, gid){
  if (script === "katakana" && !kataUnlocked()) return false;
  return gid === 1 || isKanaPassed(script, gid - 1) || isKanaPassed(script, gid);
}
function saveKanaResult(script, gid, pct, passed){
  const p = loadPath();
  p.kana = p.kana || {};
  const key = kanaKey(script, gid);
  const prev = p.kana[key] || { best: 0, passed: false };
  p.kana[key] = { best: Math.max(prev.best || 0, pct), passed: !!(prev.passed || passed), at: Date.now() };
  savePath(p);
}
function markScriptPassed(script, pct){
  const p = loadPath();
  p.kana = p.kana || {};
  KANA[script].groups.forEach(g => {
    const key = kanaKey(script, g.id);
    const prev = p.kana[key] || { best: 0 };
    p.kana[key] = { best: Math.max(prev.best || 0, pct), passed: true, at: Date.now() };
  });
  savePath(p);
}

// ---------- Fragen bauen ----------
function pickDistractors(correct, candidates, n){
  const seen = new Set([correct]);
  const out = [];
  for (const c of shuffle(candidates)) {
    if (seen.has(c)) continue;
    seen.add(c);
    out.push(c);
    if (out.length >= n) break;
  }
  return out;
}

// alle abfragbaren Einzelzeichen einer Schrift bis einschließlich Gruppe maxGid
function kanaPool(script, maxGid){
  return KANA[script].groups
    .filter(g => !g.words && g.id <= maxGid)
    .flatMap(g => g.items.map(([k, r]) => ({ k, r, gid: g.id })));
}

function kanaQuestion(dir, it, pool){
  if (dir === "k2r") {
    return { prompt: it.k, big: true, say: it.k, sub: "Wie liest man das?", answer: it.r,
             options: shuffle([it.r, ...pickDistractors(it.r, pool.map(x => x.r), 3)]), label: `${it.k} = ${it.r}`,
             srs: { key: "k:" + it.k, t: "kana", d: { k: it.k, r: it.r } } };
  }
  return { prompt: it.r, big: true, sub: "Welches Zeichen ist das?", answer: it.k,
           options: shuffle([it.k, ...pickDistractors(it.k, pool.map(x => x.k), 3)]), optionsBig: true, label: `${it.r} = ${it.k}`,
           srs: { key: "k:" + it.k, t: "kana", d: { k: it.k, r: it.r } } };
}

function wordQuestion(dir, w, words){
  const [k, r, de] = w;
  if (dir === "k2de") {
    return { prompt: k, big: true, say: k, sub: "Was bedeutet das?", answer: de,
             options: shuffle([de, ...pickDistractors(de, words.map(x => x[2]), 3)]), label: `${k} (${r}) = ${de}`,
             srs: { key: "w:" + k, t: "word", d: { k, r, de } } };
  }
  return { prompt: de, big: false, sub: "Wie schreibt man das?", answer: k,
           options: shuffle([k, ...pickDistractors(k, words.map(x => x[0]), 3)]), optionsBig: true, label: `${de} = ${k} (${r})`,
           srs: { key: "w:" + k, t: "word", d: { k, r, de } } };
}

// mode: "practice" (nur die Gruppe) | "test" (Gruppe + 3 Wiederholungen aus früheren Gruppen)
function buildKanaQuestions(script, gid, mode){
  const g = KANA[script].groups.find(x => x.id === gid);
  if (!g) return [];
  let qs = [];
  if (g.words) {
    g.items.forEach(w => {
      qs.push(wordQuestion("k2de", w, g.items));
      qs.push(wordQuestion("de2k", w, g.items));
    });
    return shuffle(qs);
  }
  const known = kanaPool(script, gid);
  g.items.forEach(([k, r]) => {
    const it = { k, r, gid };
    qs.push(kanaQuestion("k2r", it, known));
    qs.push(kanaQuestion("r2k", it, known));
  });
  qs = shuffle(qs);
  if (mode === "test" && gid > 1) {
    const earlier = kanaPool(script, gid - 1);
    shuffle(earlier).slice(0, 3).forEach(it => {
      const q = kanaQuestion(Math.random() < 0.5 ? "k2r" : "r2k", it, known);
      q.review = true;
      qs.splice(Math.floor(Math.random() * (qs.length + 1)), 0, q);
    });
  }
  return qs;
}

function buildPlacementQuestions(script){
  const all = kanaPool(script, 99);
  return shuffle(all).slice(0, 20).map(it => kanaQuestion(Math.random() < 0.5 ? "k2r" : "r2k", it, all));
}

// ---------- Quiz-Ablauf (Kana-Tests und Stufentests) ----------
// cfg: { title, questions, graded, passPct, backRoute, onFinish(pct, passed), buttons(pct, passed) -> [{label, route, primary}] }
function runQuizSession(mount, cfg){
  const qs = cfg.questions;
  if (!qs || !qs.length) {
    mount.innerHTML = `<h2>${escapeHTML(cfg.title)}</h2><div class="card"><p>Dafür gibt es noch nicht genug Material.</p>
      <div class="actions"><button onclick="goto('${cfg.backRoute}')">Zurück</button></div></div>`;
    return;
  }
  let i = 0, right = 0;
  const wrong = [];

  function show(){
    const q = qs[i];
    mount.innerHTML = `
      <h2>${escapeHTML(cfg.title)}</h2>
      <div class="card">
        <div class="hint">Frage ${i + 1} / ${qs.length}${q.review ? " · Wiederholung" : ""}</div>
        <div class="progress"><div style="width:${Math.round(100 * i / qs.length)}%;"></div></div>
        <div class="${q.big ? "big-kana" : "quiz-prompt"}">${hv(q.promptHtml) || escapeHTML(q.prompt)}</div>
        ${q.sub ? `<div class="hint" style="text-align:center;">${escapeHTML(q.sub)}</div>` : ""}
        ${q.say ? `<div style="text-align:center; margin-top:.4rem;"><button class="mini" id="qSay" type="button" aria-label="Vorlesen">🔊</button></div>` : ""}
        <div class="kana-opts${q.optionsBig ? " kana-opts-big" : ""}" id="qOpts"></div>
        <div id="qFeed" class="hint" style="min-height:1.6em; text-align:center; margin-top:.5rem;"></div>
        <div class="actions" style="margin-top:.5rem;">
          <button id="qNext" class="primary" style="display:none;"></button>
          <button onclick="goto('${cfg.backRoute}')">Abbrechen</button>
        </div>
      </div>`;
    const say = $("#qSay");
    if (say) say.onclick = () => speak(q.say);
    const opts = $("#qOpts");
    q.options.forEach(opt => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = opt;
      b.onclick = () => answer(opt, b);
      opts.appendChild(b);
    });
  }

  function answer(opt, btn){
    const q = qs[i];
    const ok = opt === q.answer;
    if (ok) right++; else wrong.push(q);
    if (q.srs) { try { srsRecord(q.srs, ok); } catch(e){} }
    $$("#qOpts button").forEach(b => {
      b.disabled = true;
      if (b.textContent === q.answer) b.classList.add("ok");
    });
    if (!ok) btn.classList.add("bad");
    $("#qFeed").textContent = ok ? "Richtig!" : `Leider falsch. Richtig ist: ${q.answer}`;
    if (q.say) speak(q.say);
    const next = $("#qNext");
    next.textContent = (i < qs.length - 1) ? "Weiter" : "Ergebnis";
    next.style.display = "";
    next.onclick = () => { i++; if (i < qs.length) show(); else finish(); };
    next.focus();
  }

  function finish(){
    const pct = Math.round(100 * right / qs.length);
    const passed = cfg.graded ? pct >= cfg.passPct : null;
    if (cfg.onFinish) { try { cfg.onFinish(pct, passed); } catch(e){} }
    const btns = (cfg.buttons ? cfg.buttons(pct, passed) : [])
      .map(b => `<button${b.primary ? ' class="primary"' : ""} onclick="goto('${b.route}')">${escapeHTML(b.label)}</button>`).join("");
    mount.innerHTML = `
      <h2>${escapeHTML(cfg.title)}</h2>
      <div class="card">
        <h3>Ergebnis: ${right} / ${qs.length} (${pct} %)</h3>
        ${cfg.graded
          ? (passed
              ? `<p><span class="badge">Bestanden</span> Stark! Der nächste Schritt ist freigeschaltet.</p>`
              : `<p><span class="badge">Noch nicht bestanden</span> Du brauchst mindestens ${cfg.passPct} %. Schau dir die Zeichen noch einmal an und versuche es erneut.</p>`)
          : `<p class="hint">${escapeHTML(cfg.ungradedNote || "Das war eine Übung, sie zählt nicht für den Fortschritt.")}</p>`}
        ${wrong.length
          ? `<h3>Zum Wiederholen</h3><ul>${wrong.map(q => `<li>${escapeHTML(q.label || (q.prompt + " → " + q.answer))}</li>`).join("")}</ul>`
          : `<p>Keine Fehler. 🎉</p>`}
        <div class="actions" style="margin-top:.5rem;">${btns}</div>
      </div>`;
  }

  show();
}

// ---------- Kachel-Darstellung ----------
function kanaTiles(items, withMeaning){
  return `<div class="kana-grid">${items.map(([k, r, de]) => `
    <button type="button" class="kana-tile" data-say="${escapeHTML(k)}" title="Anhören">
      <span class="kana">${escapeHTML(k)}</span>
      <span class="rom">${escapeHTML(r)}</span>
      ${withMeaning && de ? `<span class="de">${escapeHTML(de)}</span>` : ""}
    </button>`).join("")}</div>`;
}
function bindSay(root){
  $$("[data-say]", root).forEach(el => { el.onclick = () => speak(el.dataset.say); });
}

// ---------- Seiten: Kana ----------
function renderKanaRoute(mount, parts){
  const script = parts[0];
  if (!KANA[script]) return renderKanaHome(mount);
  if (parts[1] === undefined) return renderKanaScript(mount, script);
  if (parts[1] === "test") return renderKanaPlacement(mount, script);
  const gid = Number(parts[1]);
  const g = KANA[script].groups.find(x => x.id === gid);
  if (!g) return renderKanaScript(mount, script);
  if (!isKanaOpen(script, gid)) return renderKanaScript(mount, script);
  if (parts[2] === "practice" || parts[2] === "test") return renderKanaGroupQuiz(mount, script, g, parts[2]);
  return renderKanaGroup(mount, script, g);
}

function renderKanaGroupQuiz(mount, script, g, mode){
  const graded = (mode === "test");
  const total = KANA[script].groups.length;
  runQuizSession(mount, {
    title: `${KANA[script].name} ${g.id}: ${graded ? "Test" : "Übung"}`,
    questions: buildKanaQuestions(script, g.id, mode),
    graded, passPct: PASS_PCT,
    backRoute: `kana/${script}/${g.id}`,
    onFinish: (pct, passed) => { if (graded) saveKanaResult(script, g.id, pct, passed); },
    buttons: (pct, passed) => {
      const b = [{ label: "Nochmal", route: `kana/${script}/${g.id}/${mode}` }];
      if (passed && g.id < total) b.unshift({ label: `Weiter zu Gruppe ${g.id + 1}`, route: `kana/${script}/${g.id + 1}`, primary: true });
      b.push({ label: "Zur Gruppe", route: `kana/${script}/${g.id}` });
      return b;
    }
  });
}

function renderKanaPlacement(mount, script){
  if (script === "katakana" && !kataUnlocked()) { goto("kana/katakana"); return; }
  runQuizSession(mount, {
    title: `${KANA[script].name}: Einstufungstest`,
    questions: buildPlacementQuestions(script),
    graded: true, passPct: PLACEMENT_PCT,
    backRoute: `kana/${script}`,
    onFinish: (pct, passed) => { if (passed) markScriptPassed(script, pct); },
    buttons: (pct, passed) => passed
      ? [{ label: "Zum Lernpfad", route: "path", primary: true }, { label: "Zur Übersicht", route: `kana/${script}` }]
      : [{ label: "Nochmal versuchen", route: `kana/${script}/test` }, { label: "Von vorn lernen", route: `kana/${script}`, primary: true }]

}

// Schreibübung mit den Zeichen einer Gruppe vorbefüllen
function kanaWrite(script, gid){
  const g = KANA[script].groups.find(x => x.id === gid);
  if (!g) return;
  state.write = {
    items: g.items.map(([k, r]) => ({ de: r, romaji: r, kana: k, kanji: "" })),
    i: 0, target: "kana"
  };
  goto("write");
}

// ---------- Stufen: Vokabeltest ----------
function contentLevels(){
  ensureSeedLevels();
  return loadLevels().filter(l =>
    Array.isArray(l.vocab) && l.vocab.length && !String(l.story_ja || "").startsWith("（準備中）"));
}
function isLevelPassed(lvl){
  const t = (loadPath().levelTests || {})[lvl.id];
  return !!((t && t.passed) || (loadProgress().completedLevels || []).includes(lvl.level));
}
function levelBest(lvl){
  const t = (loadPath().levelTests || {})[lvl.id];
  return t ? (t.best || 0) : null;
}
// currentLevel = erste Stufe mit Inhalt, deren Test noch nicht bestanden ist
function syncLevelProgress(){
  const levels = contentLevels();
  if (!levels.length) return null;
  const prog = loadProgress();
  const first = levels.find(l => !isLevelPassed(l)) || levels[levels.length - 1];
  if (prog.currentLevel !== first.level) {
    prog.currentLevel = first.level;
    saveProgress(prog);
  }
  return first;
}
function markLevelResult(lvl, pct){
  const p = loadPath();
  p.levelTests = p.levelTests || {};
  const prev = p.levelTests[lvl.id] || { best: 0, passed: false };
  const passed = prev.passed || pct >= PASS_PCT;
  p.levelTests[lvl.id] = { best: Math.max(prev.best || 0, pct), passed, at: Date.now() };
  savePath(p);
  if (passed) {
    const prog = loadProgress();
    prog.completedLevels = Array.isArray(prog.completedLevels) ? prog.completedLevels : [];
    if (!prog.completedLevels.includes(lvl.level)) prog.completedLevels.push(lvl.level);
    saveProgress(prog);
    syncLevelProgress();
  }
}

function buildLevelTest(lvl){
  const usable = v => v && v.de && v.kana;
  const own = (lvl.vocab || []).filter(usable);
  if (own.length < 4) return [];
  // Zusatz-Falschantworten aus den Nachbarstufen
  const near = contentLevels().filter(l => l.id !== lvl.id && Math.abs(l.level - lvl.level) <= 3)
    .flatMap(l => l.vocab.filter(usable));
  const pool = [...own, ...near];
  return shuffle(own).slice(0, 10).map(v => vocabQuestion(v, pool));
}

// dir: "de2ja" (Deutsch → Japanisch) oder "ja2de"; ohne Angabe zufällig
function vocabQuestion(v, pool, dir){
  dir = dir || (Math.random() < 0.5 ? "de2ja" : "ja2de");
  const srs = { key: "v:" + v.de + "|" + v.kana, t: "vocab", d: { de: v.de, kana: v.kana, romaji: v.romaji || "" } };
  if (dir === "de2ja") {
    return { prompt: v.de, big: false, sub: "Wie sagt man das auf Japanisch?", answer: v.kana,
             options: shuffle([v.kana, ...pickDistractors(v.kana, pool.map(x => x.kana), 3)]), optionsBig: true,
             label: `${v.de} = ${v.kana}${v.romaji ? " (" + v.romaji + ")" : ""}`, srs };
  }
  return { prompt: v.kana, big: true, say: v.kana, sub: v.romaji || "Was bedeutet das?", answer: v.de,
           options: shuffle([v.de, ...pickDistractors(v.de, pool.map(x => x.de), 3)]),
           label: `${v.kana}${v.romaji ? " (" + v.romaji + ")" : ""} = ${v.de}`, srs };
}

function renderLevelTest(mount, id){
  const lvl = loadLevels().find(l => l.id === id);
  if (!lvl) { mount.innerHTML = `<p>Level nicht gefunden.</p>`; return; }
  const levels = contentLevels();
  const idx = levels.findIndex(l => l.id === lvl.id);
  const next = idx >= 0 ? levels[idx + 1] : null;
  runQuizSession(mount, {
    title: `Stufe ${lvl.level}: Vokabeltest`,
    questions: buildLevelTest(lvl),
    graded: true, passPct: PASS_PCT,
    backRoute: `level/read/${lvl.id}`,
    onFinish: (pct) => markLevelResult(lvl, pct),
    buttons: (pct, passed) => {
      const b = [{ label: "Nochmal", route: `level/test/${lvl.id}` }, { label: "Zur Stufe", route: `level/read/${lvl.id}` }];
      if (passed && next) b.unshift({ label: `Weiter zu Stufe ${next.level}`, route: `level/read/${next.id}`, primary: true });
      return b;
    }
  });
}

// ---------- Lernpfad-Übersicht ----------
// Grundreihenfolge aus CURRICULUM; nach jeder Stufe folgen Kanji-Gruppen (zwei in den ersten Stufen, danach je eine)
function fullCurriculum(){
  const out = [];
  let j = 1;
  const takeKanji = () => (j <= KANJI_DB.length ? "j:" + (j++) : null);
  CURRICULUM.forEach(item => {
    out.push(item);
    if (item.startsWith("l:")) for (let n = 0; n < 2; n++) { const x = takeKanji(); if (x) out.push(x); }
  });
  contentLevels().forEach(l => {
    if (!CURRICULUM.includes("l:" + l.level)) {
      out.push("l:" + l.level);
      const x = takeKanji();
      if (x) out.push(x);
    }
  });
  while (j <= KANJI_DB.length) out.push("j:" + (j++));
  return out;
}

function nextStep(){
  const hira = KANA.hiragana.groups.find(g => !isKanaPassed("hiragana", g.id));
  if (hira) return { label: `Hiragana, Gruppe ${hira.id}: ${hira.head} – ${hira.label}`,
                     desc: "Zeichen ansehen, üben und den Test bestehen.", route: `kana/hiragana/${hira.id}` };
  const levels = contentLevels();
  const levelStep = (lvl) => ({ label: `Stufe ${lvl.level}: ${lvl.title}`,
                     desc: "Story lesen, Vokabeln lernen und den Vokabeltest bestehen.", route: `level/read/${lvl.id}` });
  const used = new Set();
  for (const item of fullCurriculum()) {
    if (item === "K") {
      const kata = KANA.katakana.groups.find(g => !isKanaPassed("katakana", g.id));
      if (kata && kataUnlocked()) return { label: `Katakana, Gruppe ${kata.id}: ${kata.head} – ${kata.label}`,
                     desc: "Die Schrift für Fremdwörter und Namen.", route: `kana/katakana/${kata.id}` };
    } else if (item.startsWith("g:")) {
      const g = GRAMMAR_SEED.find(x => x.id === item.slice(2));
      if (g && !isGrammarPassed(g.id)) return { label: `Grammatik ${g.title}`,
                     desc: "Erklärung lesen und die Übungen mit mindestens " + PASS_PCT + " % bestehen.", route: `grammar/view/${g.id}` };
    } else if (item.startsWith("j:")) {
      const g = kanjiGroup(Number(item.slice(2)));
      if (g && !isKanjiPassed(g.id)) return { label: `Kanji ${g.id}: ${g.title} (${g.items.map(i => i.k).join(" ")})`,
                     desc: "Kanji mit Wörtern lernen und den Test bestehen.", route: `kanji/${g.id}` };
    } else if (item.startsWith("l:")) {
      const lvl = levels.find(l => l.level === Number(item.slice(2)));
      if (lvl) { used.add(lvl.id); if (!isLevelPassed(lvl)) return levelStep(lvl); }
    }
  }
  const rest = levels.find(l => !used.has(l.id) && !isLevelPassed(l));
  if (rest) return levelStep(rest);
  return null;
}

// =========================================================
// Furigana (Phase 3c): Lesehilfe über Kanji
// Wörterbuch aus den Stufen-Vokabeln (inkl. Wortstämmen für gebeugte Formen) plus FURIGANA_EXTRA.
// Kanji ohne bekannte Lesung bleiben ohne Hilfe stehen.
// =========================================================
const FURIGANA_KEY = "quizcards_furigana";
// [Schreibweise, Lesung]; Wörter mit Beugung als Stamm (z. B. 見, み), siehe "stem"-Regel unten
const FURIGANA_EXTRA = [
  // Zahlen und Zählwörter (Lesung hängt vom Zählwort ab)
  ["一つ","ひとつ"],["二つ","ふたつ"],["三つ","みっつ"],["四つ","よっつ"],["五つ","いつつ"],
  ["一人","ひとり"],["二人","ふたり"],["三人","さんにん"],["四人","よにん"],["五人","ごにん"],
  ["一時","いちじ"],["二時","にじ"],["三時","さんじ"],["四時","よじ"],["五時","ごじ"],["六時","ろくじ"],["七時","しちじ"],
  ["八時","はちじ"],["九時","くじ"],["十時","じゅうじ"],["十一時","じゅういちじ"],["十二時","じゅうにじ"],
  ["三時間","さんじかん"],["二時間","にじかん"],["一時間","いちじかん"],["二冊","にさつ"],["三冊","さんさつ"],
  ["三回","さんかい"],["二回","にかい"],["一回","いっかい"],["二千円","にせんえん"],["千円","せんえん"],["百円","ひゃくえん"],
  ["一","いち"],["二","に"],["三","さん"],["四","よん"],["五","ご"],["六","ろく"],["七","なな"],["八","はち"],["九","きゅう"],["十","じゅう"],["百","ひゃく"],["千","せん"],
  ["円","えん"],["一生けんめい","いっしょうけんめい"],
  // 着る (き) und 着く (つ) unterscheiden: die Formen von 着る stehen hier, 着く läuft über den Stamm
  ["着ました","きました"],["着ます","きます"],["着て","きて"],["着ている","きている"],["着ない","きない"],["時々","ときどき"],["借り","かり"],
  // 日・曜日
  ["日本","にほん"],["日本語","にほんご"],["日曜日","にちようび"],["土曜日","どようび"],["今日","きょう"],["明日","あした"],["毎日","まいにち"],
  ["毎晩","まいばん"],["毎朝","まいあさ"],["来週","らいしゅう"],["夕方","ゆうがた"],["朝早く","あさはやく"],["昼","ひる"],["朝","あさ"],
  // 名詞
  ["初もうで","はつもうで"],["牛乳","ぎゅうにゅう"],["友だち","ともだち"],["京都","きょうと"],["東京","とうきょう"],["渋谷","しぶや"],
  ["料理","りょうり"],["茶わん","ちゃわん"],["手","て"],["げた箱","げたばこ"],["教室","きょうしつ"],["電話","でんわ"],["語","ご"],
  ["質問","しつもん"],["気持ち","きもち"],["子ども","こども"],["数学","すうがく"],["英語","えいご"],["活動","かつどう"],["私","わたし"],
  ["週","しゅう"],["仕事","しごと"],["木","き"],["花","はな"],["写真","しゃしん"],["席","せき"],["最後","さいご"],["前","まえ"],["方","かた"],
  // 動詞・形容詞の語幹 (stem-Regel: davor kein Kanji, danach Hiragana)
];
const FURIGANA_STEMS = [
  ["話","はな"],["近","ちか"],["入れ","いれ"],["入り","はいり"],["買","か"],["言","い"],["教え","おしえ"],["覚え","おぼえ"],["取","と"],
  ["新","あたら"],["晴れ","はれ"],["帰","かえ"],["借","か"],["大","おお"]
];

const FURI_KANJI = /[一-鿿々]/;
const FURI_KANA = /[ぁ-ゖァ-ヺー]/;
const FURI_HIRA = /[ぁ-ゖ]/;

let _furiDict = null;

function furiAdd(map, surface, reading, stem){
  if (!surface || !reading || !FURI_KANJI.test(surface)) return;
  const cur = map.get(surface);
  if (!cur || (cur.stem && !stem)) map.set(surface, { r: reading, stem: !!stem });
}

function buildFuriDict(){
  const map = new Map();
  // 1) feste Zusatzliste: vollständige Wörter
  FURIGANA_EXTRA.forEach(([s, r]) => furiAdd(map, s, r, false));
  FURIGANA_STEMS.forEach(([s, r]) => furiAdd(map, s, r, true));
  // 2) Vokabeln aus den Stufen
  contentLevels().forEach(l => (l.vocab || []).forEach(v => {
    if (!v.kanji || !v.kana) return;
    const ks = String(v.kanji).split(/\s*\/\s*/);
    const as = String(v.kana).split(/\s*\/\s*/);
    ks.forEach((k0, i) => {
      const k = k0.replace(/[～~…・\s]/g, "");
      const a = (as[i] || as[0]).replace(/[～~…・\s]/g, "");
      if (!k || !a || !FURI_KANJI.test(k)) return;
      furiAdd(map, k, a, false);
      // Verb mit する: auch das Nomen allein (勉強する → 勉強)
      if (k.endsWith("する") && a.endsWith("する") && k.length > 2) furiAdd(map, k.slice(0, -2), a.slice(0, -2), false);
      // gebeugte Formen: letzte Kana abschneiden, wenn beide Seiten gleich enden (食べる → 食べ, 行く → 行)
      const lk = k[k.length - 1], la = a[a.length - 1];
      if (lk === la && FURI_KANA.test(lk) && k.length > 1 && a.length > 1) {
        furiAdd(map, k.slice(0, -1), a.slice(0, -1), true);
      }
    });
  }));
  return map;
}
function furiDict(){
  if (!_furiDict) _furiDict = buildFuriDict();
  return _furiDict;
}
function resetFuriDict(){ _furiDict = null; }

// Gemeinsame Kana vorne/hinten abziehen; im Rest bekommt jeder Kanji-Block seine eigene Lesung,
// Kana in der Mitte (夕ご飯, 遊びに行) bleiben ohne Furigana.
// Ergebnis: Liste von { t: Text, rt: Lesung oder "" }
function furiSplit(surface, reading){
  let a = 0, b = surface.length, ra = 0, rb = reading.length;
  while (a < b && ra < rb && surface[a] === reading[ra] && FURI_KANA.test(surface[a])) { a++; ra++; }
  while (b > a && rb > ra && surface[b - 1] === reading[rb - 1] && FURI_KANA.test(surface[b - 1])) { b--; rb--; }
  const out = [];
  if (a > 0) out.push({ t: surface.slice(0, a), rt: "" });
  const base = surface.slice(a, b), rd = reading.slice(ra, rb);
  const parts = base.match(/[\u4e00-\u9fff\u3005]+|[^\u4e00-\u9fff\u3005]+/g) || [];
  const hasMid = parts.some(p => !FURI_KANJI.test(p[0]));
  let done = false;
  if (hasMid) {
    // jedem Kanji-Block die Lesung bis zum nächsten Kana-Block zuordnen
    const tmp = [];
    let rp = 0, ok = true;
    for (let i = 0; i < parts.length && ok; i++) {
      const p = parts[i];
      if (FURI_KANJI.test(p[0])) {
        const next = parts[i + 1];
        if (next) {
          const j = rd.indexOf(next, rp + 1);
          if (j < 0) { ok = false; break; }
          tmp.push({ t: p, rt: rd.slice(rp, j) });
          rp = j;
        } else {
          tmp.push({ t: p, rt: rd.slice(rp) });
          rp = rd.length;
        }
      } else {
        if (rd.substr(rp, p.length) !== p) { ok = false; break; }
        tmp.push({ t: p, rt: "" });
        rp += p.length;
      }
    }
    if (ok && rp === rd.length) { out.push(...tmp); done = true; }
  }
  if (!done && base) out.push({ t: base, rt: rd });
  if (b < surface.length) out.push({ t: surface.slice(b), rt: "" });
  return out;
}

// Liefert { html, missing } – missing = Kanji ohne bekannte Lesung
function furiAnnotate(text){
  const dict = furiDict();
  const t = String(text || "");
  const MAXLEN = 8;
  let html = "", missing = [], i = 0;
  while (i < t.length) {
    let hit = null;
    if (FURI_KANJI.test(t[i]) || FURI_KANA.test(t[i])) {
      for (let len = Math.min(MAXLEN, t.length - i); len >= 1; len--) {
        const s = t.substr(i, len);
        const e = dict.get(s);
        if (!e) continue;
        if (e.stem) {
          const prev = i > 0 ? t[i - 1] : "";
          const next = t[i + len] || "";
          if (FURI_KANJI.test(prev) || !FURI_HIRA.test(next)) continue;
        }
        hit = { s, e };
        break;
      }
    }
    if (hit) {
      furiSplit(hit.s, hit.e.r).forEach(seg => {
        html += (seg.rt && FURI_KANJI.test(seg.t))
          ? `<ruby>${escapeHTML(seg.t)}<rt>${escapeHTML(seg.rt)}</rt></ruby>` : escapeHTML(seg.t);
      });
      i += hit.s.length;
    } else {
      if (FURI_KANJI.test(t[i])) missing.push(t.slice(Math.max(0, i - 2), i + 3));
      html += escapeHTML(t[i]);
      i++;
    }
  }
  return { html, missing };
}

function furiOn(){
  const v = lsGet(FURIGANA_KEY);
  return v === null ? true : v === "1";
}
function setFuriOn(on){
  lsSet(FURIGANA_KEY, on ? "1" : "0");
  render();
}
// Text für die Anzeige: mit Furigana, wenn eingeschaltet
function furiHTML(text){
  return furiOn() ? furiAnnotate(text).html : escapeHTML(String(text || ""));
}
function furiToggleHTML(custom){
  return `<label class="furi-toggle"><input type="checkbox" ${furiOn() ? "checked" : ""}${custom ? "" : ' onchange="setFuriOn(this.checked)"'}> Furigana anzeigen</label>`;
}

// =========================================================
// Wiederholungssystem (Phase 3b): Leitner-Boxen
// Jede geübte Karte (Kana, Wort, Vokabel) landet in einer Box 1–6.
// Richtig: eine Box höher, falsch: zurück in Box 1. Je höher die Box, desto länger die Pause.
// =========================================================
const SRS_DAYS = [1, 2, 4, 8, 16, 32];   // Abstand je Box in Tagen
const SRS_DAY_MS = 24 * 60 * 60 * 1000;
const SRS_SESSION = 15;                  // Karten pro Wiederholung

function scriptOfKana(k){ return /[゠-ヿ]/.test(k) ? "katakana" : "hiragana"; }

function srsRecord(meta, ok){
  if (!meta || !meta.key) return;
  const p = loadPath();
  p.srs = p.srs || {};
  const now = Date.now();
  let it = p.srs[meta.key];
  if (!it) {
    it = { t: meta.t, d: meta.d, box: ok ? 2 : 1, seen: 0, lapses: 0 };
  } else if (!ok) {
    it.box = 1;
  } else if (!it.last || now - it.last > 60 * 60 * 1000) {
    // zweimal richtig in derselben Stunde (z. B. beide Richtungen in einem Test) zählt nur einmal
    it.box = Math.min(SRS_DAYS.length, (it.box || 1) + 1);
  }
  if (!ok) it.lapses = (it.lapses || 0) + 1;
  it.seen = (it.seen || 0) + 1;
  it.last = now;
  it.due = now + SRS_DAYS[it.box - 1] * SRS_DAY_MS;
  p.srs[meta.key] = it;
  savePath(p);
}

function srsDueItems(){
  const now = Date.now();
  const all = loadPath().srs || {};
  return Object.entries(all).filter(([k, it]) => it && it.due <= now)
    .sort((a, b) => a[1].due - b[1].due).map(([k, it]) => ({ key: k, ...it }));
}
function srsStats(){
  const all = Object.values(loadPath().srs || {});
  return { total: all.length, due: srsDueItems().length, solid: all.filter(it => it.box >= 5).length };
}
function srsNextDue(){
  const all = Object.values(loadPath().srs || {});
  if (!all.length) return null;
  return Math.min(...all.map(it => it.due));
}
function srsWhen(ts){
  const d = ts - Date.now();
  if (d <= 0) return "jetzt";
  const h = Math.round(d / 3600000);
  if (h < 24) return h <= 1 ? "in etwa einer Stunde" : `in ${h} Stunden`;
  const days = Math.round(d / SRS_DAY_MS);
  return days === 1 ? "morgen" : `in ${days} Tagen`;
}

function allVocabPool(){
  return contentLevels().flatMap(l => (l.vocab || []).filter(v => v && v.de && v.kana));
}

// Aus einem gespeicherten Eintrag wieder eine Frage machen
// Bausteine aus abgeschlossenen Lektionen
function learnedTokens(){
  const out = [];
  WEG_UNITS.forEach(u => u.lessons.forEach(l => { if (lessonDone(l.id)) (l.teach || []).forEach(id => { if (TOK[id]) out.push(TOK[id]); }); }));
  return out;
}

function srsQuestion(item){
  const d = item.d || {};
  const dir = Math.random() < 0.5;
  if (item.t === "kana") {
    // Falschantworten nur aus bekannten Zeichen, solange genug davon da sind
    let pool = kanaPool(scriptOfKana(d.k), 99);
    const known = pool.filter(it => knownKana().has(it.k));
    if (known.length >= 6 && known.some(it => it.k === d.k)) pool = known;
    return kanaQuestion(dir ? "k2r" : "r2k", { k: d.k, r: d.r }, pool);
  }
  if (item.t === "word") {
    const g = KANA[scriptOfKana(d.k)].groups.find(x => x.words);
    return wordQuestion(dir ? "k2de" : "de2k", [d.k, d.r, d.de], g ? g.items : [[d.k, d.r, d.de]]);
  }
  if (item.t === "kanji" || item.t === "kword") return srsKanjiQuestion(item);
  if (item.t === "tok") {
    const t = TOK[(item.d || {}).id];
    if (!t) return null;
    let pool = learnedTokens().filter(x => x.kind !== "punct" && x.kind !== "part" && x.kind !== "aux" && x.kind !== "suffix");
    if (pool.length < 4) pool = Object.values(TOK).filter(x => x.kind === "word" || x.kind === "phrase");
    if (dir) return { prompt: t.ja, promptHtml: () => wegHtml([t.id]), big: true, say: t.ja, sub: "Was bedeutet das?", answer: t.de,
      options: shuffle([t.de, ...pickDistractors(t.de, pool.filter(x => x.ja !== t.ja).map(x => x.de), 3)]), srs: tokSrs(t) };
    return { prompt: t.de, big: false, sub: "Wie sagt man das auf Japanisch?", answer: t.ja,
      options: shuffle([t.ja, ...pickDistractors(t.ja, pool.map(x => x.ja), 3)]), srs: tokSrs(t) };
  }
  if (item.t === "vocab") {
    return vocabQuestion({ de: d.de, kana: d.kana, romaji: d.romaji }, allVocabPool(), dir ? "de2ja" : "ja2de");
  }
  return null;
}

// Gelerntes aus abgeschlossenen Weg-Lektionen, nach Einheit
function learnedByUnit(){
  const out = [];
  WEG_UNITS.forEach(u => {
    const toks = [], kana = [];
    u.lessons.forEach(l => {
      if (!lessonDone(l.id)) return;
      if (l.type === "kana") (l.chars || []).forEach(c => kana.push(c));
      (l.teach || []).forEach(id => {
        const t = TOK[id];
        if (t && !["punct", "part", "aux", "suffix"].includes(t.kind) && !toks.some(x => x.id === id)) toks.push(t);
      });
    });
    if (toks.length || kana.length) out.push({ unit: u, toks, kana });
  });
  return out;
}
function freeQuestions(groups, n){
  const items = [];
  groups.forEach(g => {
    g.toks.forEach(t => items.push({ t: "tok", d: { id: t.id } }));
    g.kana.forEach(([k, r]) => items.push({ t: "kana", d: { k, r } }));
  });
  return shuffle(items).slice(0, n).map(srsQuestion).filter(Boolean);
}

function renderReview(mount, sub){
  sub = sub || [];
  if (sub[0] === "due") return renderReviewDue(mount);
  if (sub[0] === "free") return renderReviewFree(mount, sub[1]);
  if (sub[0] === "list") return renderWordList(mount);
  const st = srsStats(), nxt = srsNextDue(), groups = learnedByUnit();
  const count = g => g.toks.length + g.kana.length;
  const total = groups.reduce((a, g) => a + count(g), 0);
  mount.innerHTML = `
    <h2>Wiederholen und Üben</h2>
    <div class="card">
      <h3>Fällige Karten</h3>
      ${st.due
        ? `<p><strong>${st.due} ${st.due === 1 ? "Karte ist" : "Karten sind"} fällig.</strong></p>
           <div class="actions"><button class="primary" onclick="goto('review/due')">Jetzt wiederholen</button></div>`
        : `<p>${st.total ? "Heute ist nichts fällig. 🎉" : "Hier erscheinen Zeichen, Wörter und Vokabeln, sobald du Lektionen oder Tests gemacht hast."}</p>
           ${st.total ? `<p class="hint">${st.total} Karten im System, ${st.solid} davon schon sicher. Die nächste Karte ist ${srsWhen(nxt)} dran.</p>` : ""}`}
    </div>
    <div class="card" style="margin-top:.75rem;">
      <h3>Frei üben</h3>
      ${total
        ? `<p class="hint">Hier übst du alles, was du im Weg schon gelernt hast, unabhängig vom Zeitplan.</p>
           <div class="actions"><button class="primary" onclick="goto('review/free/all')">Alles bisher Gelernte (${total})</button></div>
           <div class="actions" style="margin-top:.5rem;">${groups.map(g => {
             const o = WEG_OUTLINE[g.unit.id] || ["Einheit " + g.unit.id];
             return `<button onclick="goto('review/free/${g.unit.id}')">Einheit ${g.unit.id} · ${escapeHTML(o[0])} (${count(g)})</button>`;
           }).join("")}</div>`
        : `<p class="hint">Sobald du die erste Lektion im Weg geschafft hast, kannst du es hier frei üben.</p>`}
    </div>
    <div class="card" style="margin-top:.75rem;">
      <h3>Wortliste</h3>
      <p class="hint">Alle Wörter und Zeichen aus geschafften Lektionen zum Nachschauen und Anhören.</p>
      <div class="actions"><button onclick="goto('review/list')"${total ? "" : " disabled"}>Wortliste öffnen</button></div>
    </div>`;
}

function renderReviewDue(mount){
  const due = srsDueItems().slice(0, SRS_SESSION);
  const qs = due.map(srsQuestion).filter(Boolean);
  if (!qs.length) { goto("review"); return; }
  runQuizSession(mount, {
    title: "Wiederholung",
    questions: qs,
    graded: false,
    onFinish: () => dailyAdd(1),
    ungradedNote: "Deine Karten wurden neu eingeordnet: Richtiges kommt später wieder, Falsches früher.",
    backRoute: "review",
    buttons: () => {
      const more = srsDueItems().length;
      const b = [{ label: "Zur Übersicht", route: "review", primary: !more }];
      if (more) b.unshift({ label: `Weiter (${more} fällig)`, route: "review/due", primary: true });
      return b;
    }
  });
}

function renderReviewFree(mount, which){
  let groups = learnedByUnit();
  if (which && which !== "all") groups = groups.filter(g => String(g.unit.id) === which);
  const qs = freeQuestions(groups, SRS_SESSION);
  if (!qs.length) { goto("review"); return; }
  runQuizSession(mount, {
    title: which && which !== "all" ? `Üben: Einheit ${which}` : "Üben: alles bisher Gelernte",
    questions: qs,
    graded: false,
    ungradedNote: "Gut geübt! Deine Antworten fließen auch in den Wiederholungsplan ein.",
    backRoute: "review",
    buttons: () => [{ label: "Noch eine Runde", route: "review/free/" + (which || "all"), primary: true }, { label: "Zur Übersicht", route: "review" }]
  });
}

function renderWordList(mount){

  mount.innerHTML = `

          <option value="auto"${scriptMode() === "auto" ? " selected" : ""}>Auto (Romaji-Hilfe)</option>
          <option value="romaji"${scriptMode() === "romaji" ? " selected" : ""}>Nur Romaji</option>
          <option value="kana"${scriptMode() === "kana" ? " selected" : ""}>Nur Kana</option>

      </div>`;
    }).join("")}`;
  $$("[data-say]", mount).forEach(el => { el.onclick = () => speak(el.dataset.say); });
  $("#wlScript").onchange = (e) => { setScriptMode(e.target.value); renderWordList(mount); };
}

const KANJI_DB = KANJI_GROUPS.map(g => ({
  id: g.id, title: g.title, note: g.note,
  items: g.kanji.map(([k, m, on, kun, words]) => ({ k, m, on, kun, words, gid: g.id }))
}));

function kanjiGroup(gid){ return KANJI_DB.find(g => g.id === gid); }
// alle Kanji bis einschließlich Gruppe maxGid
function kanjiPool(maxGid){
  return KANJI_DB.filter(g => g.id <= maxGid).flatMap(g => g.items);
}

// ---------- Fortschritt ----------
function isKanjiPassed(gid){
  const k = (loadPath().kanji || {})[gid];
  return !!(k && k.passed);
}
function kanjiBest(gid){
  const k = (loadPath().kanji || {})[gid];
  return k ? (k.best || 0) : null;
}
function kanjiStats(){
  return { passed: KANJI_DB.filter(g => isKanjiPassed(g.id)).length, total: KANJI_DB.length };
}
function kanjiUnlocked(){ return hiraBasicDone() || !!loadPath().forceKanji || Object.keys(WEG_EXTRA).some(u => (WEG_EXTRA[u].kanji || []).length && unitDone(Number(u))); }
function isKanjiOpen(gid){
  if (kanjiWegOpen(gid)) return true;
  if (!kanjiUnlocked()) return false;
  return gid === 1 || isKanjiPassed(gid - 1) || isKanjiPassed(gid);
}
function saveKanjiResult(gid, pct, passed){
  const p = loadPath();
  p.kanji = p.kanji || {};
  const prev = p.kanji[gid] || { best: 0, passed: false };
  p.kanji[gid] = { best: Math.max(prev.best || 0, pct), passed: !!(prev.passed || passed), at: Date.now() };
  savePath(p);
}
function unlockKanji(){
  const p = loadPath();
  p.forceKanji = true;
  savePath(p);
  goto("kanji");
}

// ---------- Fragen ----------
// kind: "k2m" Kanji → Bedeutung | "m2k" Bedeutung → Kanji | "w2r" Wort → Lesung
function kanjiQuestion(kind, it, pool, wordIdx){
  if (kind === "k2m") {
    return { prompt: it.k, big: true, sub: "Was bedeutet dieses Kanji?", answer: it.m,
             options: shuffle([it.m, ...pickDistractors(it.m, pool.map(x => x.m), 3)]),
             label: `${it.k} = ${it.m}`, srs: { key: "j:" + it.k, t: "kanji", d: { k: it.k, m: it.m } } };
  }
  if (kind === "m2k") {
    return { prompt: it.m, big: false, sub: "Welches Kanji ist das?", answer: it.k,
             options: shuffle([it.k, ...pickDistractors(it.k, pool.map(x => x.k), 3)]), optionsBig: true,
             label: `${it.m} = ${it.k}`, srs: { key: "j:" + it.k, t: "kanji", d: { k: it.k, m: it.m } } };
  }
  const words = it.words || [];
  const w = words[wordIdx != null ? wordIdx : Math.floor(Math.random() * words.length)];
  if (!w) return kanjiQuestion("k2m", it, pool);
  const allReadings = pool.flatMap(x => x.words.map(y => y[1]));
  return { prompt: w[0], big: true, say: w[1], sub: `Wie liest man das? (${w[2]})`, answer: w[1],
           options: shuffle([w[1], ...pickDistractors(w[1], allReadings, 3)]),
           label: `${w[0]} = ${w[1]} (${w[2]})`, srs: { key: "jw:" + w[0], t: "kword", d: { w: w[0], r: w[1], de: w[2] } } };
}

// mode: "practice" (alle drei Fragearten je Kanji) | "test" (zwei zufällige Arten je Kanji + 3 Wiederholungen)
function buildKanjiQuestions(gid, mode){
  const g = kanjiGroup(gid);
  if (!g) return [];
  const pool = kanjiPool(gid);
  const kinds = ["k2m", "m2k", "w2r"];
  let qs = [];
  g.items.forEach(it => {
    const use = mode === "test" ? shuffle(kinds).slice(0, 2) : kinds;
    use.forEach(kind => qs.push(kanjiQuestion(kind, it, pool)));
  });
  qs = shuffle(qs);
  if (mode === "test" && gid > 1) {
    shuffle(kanjiPool(gid - 1)).slice(0, 3).forEach(it => {
      const q = kanjiQuestion(shuffle(kinds)[0], it, pool);
      q.review = true;
      qs.splice(Math.floor(Math.random() * (qs.length + 1)), 0, q);
    });
  }
  return qs;
}

// Eintrag aus dem Wiederholungssystem wieder zur Frage machen
function srsKanjiQuestion(item){
  const d = item.d || {};
  const all = kanjiPool(99);
  if (item.t === "kanji") {
    const it = all.find(x => x.k === d.k);
    return it ? kanjiQuestion(Math.random() < 0.5 ? "k2m" : "m2k", it, all) : null;
  }
  const it = all.find(x => x.words.some(y => y[0] === d.w));
  if (!it) return null;
  return kanjiQuestion("w2r", it, all, it.words.findIndex(y => y[0] === d.w));
}

// ---------- Seiten ----------
function renderKanjiRoute(mount, parts){
  if (parts[0] === undefined) return renderKanjiHome(mount);
  const gid = Number(parts[0]);
  const g = kanjiGroup(gid);
  if (!g || !isKanjiOpen(gid)) return renderKanjiHome(mount);
  if (parts[1] === "practice" || parts[1] === "test") return renderKanjiQuiz(mount, g, parts[1]);
  return renderKanjiGroup(mount, g);
}

function renderKanjiHome(mount){
  const st = kanjiStats();
  const locked = !kanjiUnlocked();
  mount.innerHTML = `
    <h2>Kanji</h2>
    <div class="card">
      <div class="hint">${st.passed} / ${st.total} Gruppen bestanden · ${KANJI_DB.reduce((a, g) => a + g.items.length, 0)} Kanji</div>
      <div class="progress"><div style="width:${Math.round(100 * st.passed / st.total)}%;"></div></div>
      <p class="hint" style="margin-top:.5rem;">Kanji sind Schriftzeichen mit Bedeutung. Jedes hat meist zwei Lesungen: on (aus dem Chinesischen) und kun (japanisch). Lerne sie am besten als Wörter, nicht einzeln.</p>
    </div>
    ${locked ? `
      <div class="card">
        <h3>Noch gesperrt</h3>
        <p>Der Kanji-Kurs wird freigeschaltet, sobald die Hiragana-Gruppen 1–10 bestanden sind. In den Lesetexten helfen dir bis dahin die Furigana.</p>
        <div class="actions">
          <button class="primary" onclick="goto('kana/hiragana')">Zu Hiragana</button>
          <button onclick="unlockKanji()">Trotzdem freischalten</button>
        </div>
      </div>` : `
    <div class="grid" style="margin-top:.75rem;">
      ${KANJI_DB.map(g => {
        const open = isKanjiOpen(g.id), done = isKanjiPassed(g.id), best = kanjiBest(g.id);
        return `
        <div class="card${open ? "" : " step-locked"}">
          <h3>${g.id}. ${escapeHTML(g.title)}</h3>
          <div class="kana-preview">${escapeHTML(g.items.map(i => i.k).join(" "))}</div>
          ${done ? `<span class="badge">Bestanden${best != null ? " · " + best + " %" : ""}</span>`
                 : (open ? `<span class="badge">Als Nächstes</span>` : `<span class="hint">🔒 Zuerst Gruppe ${g.id - 1} bestehen</span>`)}
          <div class="actions" style="margin-top:.5rem;">
            ${open ? `<button class="primary" onclick="goto('kanji/${g.id}')">${done ? "Wiederholen" : "Lernen"}</button>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`}
    <div class="actions" style="margin-top:1rem;"><button onclick="goto('weg')">Zurück zum Weg</button></div>`;
}

function renderKanjiGroup(mount, g){
  const done = isKanjiPassed(g.id);
  mount.innerHTML = `
    <h2>${g.id}. ${escapeHTML(g.title)}</h2>
    <p class="hint">Tippe ein Wort an, um es anzuhören.</p>
    ${g.items.map(it => `
      <div class="card kanji-card">
        <div class="kanji-big">${escapeHTML(it.k)}</div>
        <div>
          <h3 style="margin:0;">${escapeHTML(it.m)}</h3>
          <div class="hint">on: ${escapeHTML(it.on || "–")} · kun: ${escapeHTML(it.kun || "–")}</div>
          <ul class="kanji-words">${it.words.map(w => `
            <li><button type="button" class="mini" data-say="${escapeHTML(w[1])}" aria-label="Vorlesen" style="width:auto;">🔊</button>
              <strong>${escapeHTML(w[0])}</strong> <span class="hint">${escapeHTML(w[1])} – ${escapeHTML(w[2])}</span></li>`).join("")}
          </ul>
        </div>
      </div>`).join("")}
    <div class="card"><strong>Gut zu wissen</strong><p style="margin:.3rem 0 0;">${escapeHTML(g.note || "")}</p></div>
    <div class="actions" style="margin-top:.75rem;">
      <button onclick="goto('kanji/${g.id}/practice')">Üben (zählt nicht)</button>
      <button onclick="kanjiWrite(${g.id})">Schreiben üben</button>
      <button class="primary" onclick="goto('kanji/${g.id}/test')">Test (mind. ${PASS_PCT} %)</button>
    </div>
    <div class="actions" style="margin-top:.5rem;">
      ${done && g.id < KANJI_DB.length ? `<button onclick="goto('kanji/${g.id + 1}')">Weiter zu Gruppe ${g.id + 1}</button>` : ""}
      <button onclick="goto('kanji')">Zur Übersicht</button>
    </div>`;
  bindSay(mount);
}

function renderKanjiQuiz(mount, g, mode){
  const graded = (mode === "test");
  runQuizSession(mount, {
    title: `Kanji ${g.id}: ${graded ? "Test" : "Übung"}`,
    questions: buildKanjiQuestions(g.id, mode),
    graded, passPct: PASS_PCT,
    backRoute: `kanji/${g.id}`,
    onFinish: (pct, passed) => { if (graded) saveKanjiResult(g.id, pct, passed); },
    buttons: (pct, passed) => {
      const b = [{ label: "Nochmal", route: `kanji/${g.id}/${mode}` }];
      if (passed && g.id < KANJI_DB.length) b.unshift({ label: `Weiter zu Gruppe ${g.id + 1}`, route: `kanji/${g.id + 1}`, primary: true });
      b.push({ label: "Zur Gruppe", route: `kanji/${g.id}` });
      return b;
    }
  });
}

// Schreibübung mit den Kanji einer Gruppe vorbefüllen
function kanjiWrite(gid){
  const g = kanjiGroup(gid);
  if (!g) return;
  state.write = {
    items: g.items.map(it => ({ de: it.m, romaji: it.kun || it.on, kana: it.words[0] ? it.words[0][1] : "", kanji: it.k })),
    i: 0, target: "kanji", src: "custom"
  };
  goto("write");
}

function wegJoin(toks, field){
  let out = "";
  toks.forEach((t, i) => {
    const txt = t[field];
    if (i === 0) { out += txt; return; }
    const prev = toks[i - 1];
    const numRun = t.kind === "num" && prev.kind === "num";   // Zahlen werden ohne Lücke zusammengesetzt
    if (field === "ja") {

function kanaPoolFor(lesson, unitId, idx){

  const out = [];

    srsDueItems().forEach(item => {
      if (out.length >= n) return;
      const q = srsQuestion(item);
      if (q) out.push(qToMc(q));
    });
    if (out.length < n) {
      const pool = introducedTokens(unitId, idx, true);
      shuffle(pool).slice(0, n - out.length).forEach(t => {
        out.push(Math.random() < 0.5 ? exTokJa2De(t, pool) : exTokDe2Ja(t, pool));
      });
    }
    if (out.length < n && lesson && lesson.type === "kana") {
      const prev = [];
      WEG_UNITS.forEach(u => u.lessons.forEach((l, li) => {
        if (l.type === "kana" && l.script === lesson.script && (u.id < unitId || (u.id === unitId && li < idx))) l.chars.forEach(c => prev.push(c));
