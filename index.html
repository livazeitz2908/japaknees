<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QuizCards – Komplett (Single‑File, inline CSS & JS)</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>

:root {
  --gap: .75rem;

  /* Neues freundliches Sommer-Theme */
  --bg-dark: #f8fcff;
  --bg-light: #fffdf8;
  --white: #25313a;
  --lavender: #e98aa5;

  --ink: #25313a;
  --muted: #6e7c85;
  --paper: rgba(255, 253, 248, 0.82);
  --paper-strong: rgba(255, 255, 255, 0.94);
  --border: rgba(226, 206, 178, 0.75);

  --sakura: #f5a9bf;
  --sunset: #ff9478;
  --yuzu: #ffd66b;
  --matcha: #7fb685;
  --mizu: #55b9c7;
  --sea: #2f9fb3;

  --shadow-soft: 0 14px 35px rgba(96, 129, 141, 0.16);
  --shadow-hover: 0 20px 42px rgba(96, 129, 141, 0.22);

  --nav-offset-mobile: 64px;
  --app-h: 100svh;
}

/* Basis */
html {
  font-size: clamp(15px, 1.6vw + 0.5rem, 18px);
  min-height: var(--app-h);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  margin: 0;
  min-height: var(--app-h);
  padding: 1.5rem;
  padding-left: calc(1.5rem + env(safe-area-inset-left));
  padding-right: calc(1.5rem + env(safe-area-inset-right));
  padding-top: calc(1.25rem + env(safe-area-inset-top));
  padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
  line-height: 1.5;
  color: var(--ink);

  background:
    radial-gradient(circle at 8% 8%, rgba(245, 169, 191, 0.32) 0 9rem, transparent 9.2rem),
    radial-gradient(circle at 92% 4%, rgba(255, 214, 107, 0.36) 0 10rem, transparent 10.3rem),
    radial-gradient(circle at 70% 88%, rgba(85, 185, 199, 0.24) 0 13rem, transparent 13.2rem),
    linear-gradient(145deg, #fff8ee 0%, #f8fcff 42%, #edf9f7 100%);
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background:
    linear-gradient(120deg, transparent 0 55%, rgba(255,255,255,.38) 55% 56%, transparent 56%),
    radial-gradient(circle at 18% 74%, rgba(127, 182, 133, .12), transparent 16rem),
    radial-gradient(circle at 86% 34%, rgba(233, 138, 165, .13), transparent 14rem);
}

.app,
body,
html {
  min-height: var(--app-h);
}

h1,
h2 {
  color: #24404b;
  letter-spacing: -0.03em;
  margin-top: .2rem;
}

h1 {
  font-size: clamp(2rem, 5vw, 3.4rem);
}

h2 {
  font-size: clamp(1.5rem, 3.5vw, 2.35rem);
}

h3 {
  color: #31515c;
}

a {
  color: var(--sea);
}

#app {
  min-height: 60vh;
}

/* Navigation */
nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap);
  align-items: center;
  margin-bottom: 1.25rem;
  padding: .7rem;
  border: 1px solid var(--border);
  border-radius: 1.2rem;
  background: rgba(255, 255, 255, 0.56);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow-soft);
}

.nav-toggle {
  display: none;
  position: fixed;
  z-index: 1100;
  top: calc(8px + env(safe-area-inset-top));
  left: calc(10px + env(safe-area-inset-left));
  padding: .55rem .85rem;
  border-radius: 999px;
  background: rgba(255, 253, 248, 0.9);
  border: 1px solid var(--border);
  color: var(--ink);
  font-size: .95rem;
  gap: .35rem;
  align-items: center;
  box-shadow: var(--shadow-soft);
}

/* Buttons */
button,
.import-label {
  min-height: 48px;
  padding: .58rem .9rem;
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid rgba(226, 206, 178, 0.78);
  border-radius: 999px;
  cursor: pointer;
  color: var(--ink);
  font-weight: 650;
  box-shadow: 0 6px 16px rgba(96, 129, 141, 0.09);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    border-color .18s ease;
  touch-action: manipulation;
}

button:hover,
.import-label:hover {
  background: #fff;
  border-color: rgba(255, 148, 120, 0.55);
  box-shadow: 0 10px 22px rgba(96, 129, 141, 0.15);
  transform: translateY(-1px);
}

button:active,
.import-label:active {
  transform: translateY(1px) scale(.99);
}

button.primary {
  border: none;
  color: #fff;
  background: linear-gradient(135deg, var(--sunset), var(--sakura));
  box-shadow: 0 10px 24px rgba(233, 138, 165, 0.28);
}

button.primary:hover {
  filter: saturate(1.05) brightness(1.02);
}

button.danger {
  border: 1px solid rgba(220, 105, 105, 0.34);
  background: #fff1f0;
  color: #b44444;
}

button.danger:hover {
  background: #ffe7e4;
  border-color: rgba(220, 105, 105, 0.48);
}

button.mini {
  min-height: auto;
  padding: .2rem .48rem;
  font-size: .9em;
  border-radius: 999px;
}

.import-label {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
}

/* Inputs */
#search,
input,
textarea,
.spell-input {
  width: 100%;
  min-height: 48px;
  padding: .68rem .82rem;
  border: 1px solid rgba(226, 206, 178, 0.8);
  border-radius: .95rem;
  background: rgba(255, 255, 255, 0.84);
  color: var(--ink);
  font-size: 1rem;
  outline: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}

#search {
  min-width: 220px;
}

#search:focus,
input:focus,
textarea:focus,
.spell-input:focus {
  background: #fff;
  border-color: rgba(85, 185, 199, 0.75);
  box-shadow: 0 0 0 4px rgba(85, 185, 199, 0.16);
}

textarea {
  resize: vertical;
}

label {
  display: block;
  margin: .25rem 0;
  font-size: .9rem;
  font-weight: 700;
  color: #4f7d80;
}

form {
  display: grid;
  gap: .55rem;
  margin: .5rem 0 1rem;
}

/* Cards / Panels */
.card,
.match-item,
.badge {
  background: var(--paper);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.75);
  box-shadow: var(--shadow-soft);
  transition:
    box-shadow .24s ease,
    transform .24s ease,
    border-color .24s ease,
    background .24s ease;
}

.card {
  position: relative;
  overflow: hidden;
  padding: 1rem;
  border-radius: 1.25rem;
  margin: .65rem 0;
  color: var(--ink);
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 100% 0%, rgba(255, 214, 107, 0.16), transparent 8rem),
    radial-gradient(circle at 0% 100%, rgba(85, 185, 199, 0.12), transparent 9rem);
}

.card > * {
  position: relative;
}

.card h3 {
  margin: 0 0 .5rem;
  color: #305866;
}

.card:hover,
.match-item:hover {
  background: rgba(255, 255, 255, 0.9);
  border-color: rgba(255, 148, 120, 0.34);
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}

.badge {
  display: inline-block;
  font-size: .8rem;
  font-weight: 750;
  padding: .18rem .6rem;
  border-radius: 999px;
  background: rgba(237, 249, 247, 0.92);
  color: #31737a;
  border: 1px solid rgba(85, 185, 199, .2);
}

.actions {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}

.grid {
  display: grid;
  gap: .85rem;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

hr {
  border: 0;
  border-top: 1px solid rgba(226, 206, 178, 0.75);
  margin: 1rem 0;
}

footer {
  margin-top: 2rem;
  color: var(--muted);
}

/* Match-Modus */
.match-board {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: .85rem;
}

.match-col {
  display: grid;
  gap: .55rem;
}

.match-item {
  padding: .7rem .85rem;
  border-radius: 1rem;
  cursor: pointer;
  text-align: left;
  color: var(--ink);
}

.match-item.selected {
  outline: 3px solid rgba(255, 148, 120, 0.38);
  background: linear-gradient(135deg, rgba(255, 245, 229, .96), rgba(255, 236, 241, .96));
  border-color: rgba(255, 148, 120, .42);
}

.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  color: #d56f57;
}

.hint {
  color: var(--muted);
  font-size: .92rem;
}

/* Schreibübung */
.write-pad {
  gap: .5rem;
  display: grid;
}

.write-pad-controls {
  display: flex;
  gap: .5rem;
  align-items: center;
}

.write-pad-stage {
  position: relative;
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 4/2;
  border: 1px solid rgba(226, 206, 178, 0.85);
  border-radius: 1.25rem;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(85,185,199,.08) 1px, transparent 1px),
    linear-gradient(0deg, rgba(85,185,199,.08) 1px, transparent 1px),
    #fffef9;
  background-size: 48px 48px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.75), var(--shadow-soft);
}

.write-pad-stage canvas,
.write-pad-stage #writeHint {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.write-pad-stage #writeHint {
  display: grid;
  place-items: center;
  color: rgba(49, 81, 92, 0.22);
  font-size: clamp(48px, 20cqw, 140px);
  pointer-events: none;
  user-select: none;
  line-height: 1;
}

#writeCanvas {
  display: block;
  width: 100%;
  height: 100%;
  background: transparent;
  cursor: crosshair;
  touch-action: none;
}

.write-pad button {
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(226, 206, 178, 0.86);
  border-radius: 999px;
  padding: .45rem .7rem;
}

.write-pad button:active {
  transform: translateY(1px);
}

.write-layout {
  display: grid;
  grid-template-columns: minmax(420px, 1fr) minmax(320px, 440px);
  gap: 20px;
  align-items: start;
}

#write-prompt {
  position: static !important;
}

.write-toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  min-width: 0;
}

#write-prompt #wp-big:empty::after {
  content: "—";
  opacity: .25;
}

/* Progress */
.progress {
  height: 11px;
  background: rgba(85, 185, 199, 0.13);
  border-radius: 999px;
  overflow: hidden;
  margin-top: .35rem;
  border: 1px solid rgba(85, 185, 199, 0.14);
}

.progress > div {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--mizu), var(--matcha), var(--yuzu));
  transition: width .3s ease;
}

.level-card h3 {
  margin-bottom: .25rem;
}

/* Chat / Übersetzungen */
.msg.trans {
  align-self: center;
  max-width: 520px;
  font-size: .95rem;
  line-height: 1.45;
  background: rgba(255, 253, 248, .9);
  border-left: 4px solid var(--mizu);
  padding: .65rem .85rem;
  border-radius: 1rem;
  margin: .35rem 0 .5rem;
  color: var(--ink);
  box-shadow: 0 8px 20px rgba(96, 129, 141, 0.1);
}

.msg.trans .tline {
  display: block;
  opacity: .95;
}

.msg.trans .tline + .tline {
  margin-top: .25rem;
  opacity: .85;
}

.chat .opt[disabled] {
  opacity: .6;
  pointer-events: none;
}

/* Aufnahmebuttons */
#chatRecordBtn,
#speakBtn {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

#speakBtn {
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
}

#speakBtn.recording {
  background: #d94a4a !important;
  color: white !important;
  border-color: #ffc8c8 !important;
  box-shadow: 0 0 14px rgba(217, 74, 74, 0.55);
  animation: micPulse 1.1s infinite ease-in-out;
}

@keyframes micPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.07); }
  100% { transform: scale(1); }
}

#speakBtn.recording .mic-icon {
  filter: brightness(200%);
}

#chatRecordBtn.recording {
  background: #d94a4a !important;
  color: #fff !important;
  transform: scale(0.94);
  box-shadow: 0 0 12px rgba(217, 74, 74, 0.45);
  transition: all .12s ease-out;
}

/* Japanischer Text / Tooltips */
.jt {
  cursor: default;
  white-space: pre-wrap;
}

.jt-clickable {
  cursor: pointer;
}

.jt-tooltip {
  position: absolute;
  background: rgba(255, 255, 255, 0.96);
  color: var(--ink);
  padding: 5px 9px;
  border-radius: 999px;
  box-shadow: 0 8px 22px rgba(96, 129, 141, 0.18);
  border: 1px solid rgba(226, 206, 178, 0.72);
  font-size: 0.85rem;
  z-index: 9999;
  opacity: 0;
  animation: fadeIn 0.15s forwards;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(2px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.vocab-token {
  cursor: pointer;
  border-bottom: 1px dotted rgba(47, 159, 179, 0.55);
  padding: 0 0.05em;
  border-radius: .22rem;
  transition: background .16s ease, color .16s ease;
}

.vocab-token:hover {
  background: rgba(255, 214, 107, 0.28);
  color: #24404b;
}

.vocab-info {
  margin-top: 0.75rem;
  font-size: 0.9rem;
  color: var(--muted);
  opacity: 0.96;
}

/* Kleine Details */
code {
  padding: .1rem .35rem;
  border-radius: .4rem;
  background: rgba(85, 185, 199, 0.11);
  color: #246f7a;
}

summary {
  cursor: pointer;
  font-weight: 750;
  color: #31515c;
}

details {
  border-radius: 1rem;
}

/* Mobile */
@media (max-width: 720px) {
  .write-layout {
    grid-template-columns: 1fr;
  }

  .write-toolbar {
    flex-wrap: wrap;
  }
}

@media (max-width: 600px) {
  body {
    padding-top: calc(3.2rem + env(safe-area-inset-top));
  }

  .nav-toggle {
    display: inline-flex;
  }

  nav {
    position: fixed;
    top: calc(3rem + env(safe-area-inset-top));
    left: 0;
    right: 0;
    z-index: 1000;

    background: rgba(255, 253, 248, 0.96);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    padding: .7rem calc(10px + env(safe-area-inset-right));
    padding-left: calc(10px + env(safe-area-inset-left));
    border-radius: 0 0 1.2rem 1.2rem;
    border: 1px solid rgba(226, 206, 178, 0.7);
    border-top: none;
    box-shadow: 0 14px 28px rgba(96, 129, 141, 0.18);

    display: flex;
    flex-wrap: wrap;
    gap: .45rem;
    justify-content: flex-start;

    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
  }

  body.nav-open nav {
    max-height: 320px;
  }

  nav button,
  nav .import-label,
  nav #search {
    font-size: 0.95em;
    padding: .48rem .68rem;
    min-height: 42px;
    width: auto;
    text-align: center;
    justify-content: center;
  }

  nav #search {
    flex: 1 1 100%;
  }
}

@media (max-width: 400px) {
  body {
    padding: 1rem;
    padding-top: calc(3.2rem + env(safe-area-inset-top));
  }

  nav {
    gap: .5rem;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: .65rem;
  }

  .match-board {
    grid-template-columns: 1fr;
  }

  button,
  .import-label,
  input,
  textarea,
  #search {
    width: 100%;
  }

  .card {
    padding: .95rem;
  }

  .card,
  .match-item,
  .badge {
    box-shadow: 0 10px 26px rgba(96, 129, 141, 0.13);
  }

  .card:hover,
  .match-item:hover {
    box-shadow: 0 12px 28px rgba(96, 129, 141, 0.16);
    transform: translateY(-1px);
  }
}

@media (min-width: 401px) and (max-width: 430px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .match-board {
    grid-template-columns: 1fr;
  }

  button,
  .import-label {
    min-height: 44px;
  }
}

@media (min-width: 431px) and (max-width: 480px) {
  .grid {
    grid-template-columns: repeat(2, minmax(200px, 1fr));
  }

  .match-board {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (min-width: 600px) and (max-width: 1024px) {
  .grid {
    grid-template-columns: repeat(2, minmax(260px, 1fr));
  }

  .match-board {
    grid-template-columns: repeat(2, 1fr);
  }

  nav {
    justify-content: flex-start;
  }

  nav button,
  nav .import-label,
  nav #search {
    padding: .62rem .85rem;
    min-height: 44px;
  }
}

@media (min-width: 1025px) {
  .grid {
    grid-template-columns: repeat(3, minmax(260px, 1fr));
  }
}

/* Touch / Accessibility */
@media (hover: none) {
  .card:hover,
  .match-item:hover,
  button:hover,
  .import-label:hover {
    transform: none;
  }

  nav *:hover {
    filter: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}
/* === Neue Flashcard-Lernen-Funktion === */

.flash-learn {
  max-width: 820px;
  margin: 0 auto;
}

.flash-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}

.flash-head h2 {
  margin-bottom: .1rem;
}

.flash-head p {
  margin: 0;
  color: var(--muted);
}

.flash-counter {
  padding: .45rem .8rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, .75);
  border: 1px solid var(--border);
  font-weight: 800;
  color: #31515c;
  box-shadow: var(--shadow-soft);
}

.flash-settings {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .85rem;
  margin-bottom: 1rem;
}

.flash-setting-group {
  display: grid;
  gap: .4rem;
}

.flash-setting-group > span {
  font-size: .85rem;
  font-weight: 800;
  color: #4f7d80;
}

.segmented {
  display: flex;
  gap: .35rem;
  padding: .25rem;
  border-radius: 999px;
  background: rgba(85, 185, 199, .09);
  border: 1px solid rgba(85, 185, 199, .16);
}

.segmented button {
  flex: 1;
  min-height: 40px;
  padding: .4rem .65rem;
  border-radius: 999px;
  background: transparent;
  border: none;
  box-shadow: none;
  color: #42646d;
}

.segmented button:hover {
  transform: none;
  box-shadow: none;
  background: rgba(255, 255, 255, .55);
}

.segmented button.active {
  color: #fff;
  background: linear-gradient(135deg, var(--mizu), var(--matcha));
  box-shadow: 0 8px 18px rgba(85, 185, 199, .22);
}

.flash-progress {
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  margin: .85rem 0 1rem;
  background: rgba(85, 185, 199, .13);
  border: 1px solid rgba(85, 185, 199, .14);
}

.flash-progress > div {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--mizu), var(--matcha), var(--yuzu));
  transition: width .25s ease;
}

.flashcard {
  display: block;
  width: min(430px, 100%);
  height: min(560px, 72vh);
  min-height: 430px;
  margin: 1.1rem auto;
  padding: 0;
  border: none;
  border-radius: 2rem;
  background: transparent;
  box-shadow: none;
  perspective: 1200px;
}

.flashcard:hover {
  background: transparent;
  box-shadow: none;
  transform: translateY(-2px);
}

.flashcard-inner {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.2, .7, .2, 1);
}

.flashcard.is-flipped .flashcard-inner {
  transform: rotateY(180deg);
}

.flashcard-face {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: 45% 55%;
  overflow: hidden;
  border-radius: 2rem;
  border: 1px solid rgba(255, 255, 255, .85);
  box-shadow: 0 22px 48px rgba(96, 129, 141, .24);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.flashcard-back {
  transform: rotateY(180deg);
}

.flashcard-top {
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 214, 107, .28), transparent 7rem),
    linear-gradient(180deg, #ffffff 0%, #fffdf8 100%);
}

.flashcard-top.back {
  background:
    radial-gradient(circle at 80% 18%, rgba(245, 169, 191, .28), transparent 7rem),
    linear-gradient(180deg, #ffffff 0%, #f8fcff 100%);
}

.flash-symbol {
  font-size: clamp(1rem, 5vw, 1.5rem);
  line-height: 1;
  color: #111;
  font-weight: 800;
  filter: drop-shadow(0 8px 14px rgba(96, 129, 141, .12));
}

.flashcard-bottom {
  position: relative;
  display: grid;
  place-items: center;
  align-content: center;
  gap: .75rem;
  padding: 2rem;
  color: #fff;
  background:
    radial-gradient(circle at 30% 80%, rgb(242, 196, 247), transparent 7rem),
    linear-gradient(145deg, #db82ed 0%, #f58ca2 46%, #fb97d6 100%);
}

.flashcard-bottom::before {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 1.1rem;
  width: 180px;
  height: 100px;
  transform: translateX(-50%);
  opacity: .24;
  background-repeat: no-repeat;
  background-size: 90px 90px, 105px 105px, 130px 130px;
  background-position: 8px 18px, 66px 10px, 34px 0;
}

.flashcard-bottom.back {
  background:
    radial-gradient(circle at 30% 80%, rgb(253, 239, 150), transparent 7rem),
    linear-gradient(145deg, #eddb82 0%, #f58ca2 46%, #fadd72 100%);
}

.flash-label,
.flash-word,
.flash-tap {
  position: relative;
  z-index: 1;
}

.flash-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 88px;
  padding: .28rem .65rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, .22);
  font-size: .78rem;
  font-weight: 850;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.flash-word {
  max-width: 100%;
  text-align: center;
  font-size: clamp(4.3rem, 12vw, 4.5rem);
  font-weight: 850;
  line-height: 1.08;
  letter-spacing: -.03em;
  overflow-wrap: anywhere;
  text-shadow: 0 8px 20px rgba(96, 60, 70, .18);
}

.flash-tap {
  font-size: .9rem;
  font-weight: 700;
  opacity: .82;
}

.flash-actions {
  display: flex;
  justify-content: center;
  gap: .6rem;
  flex-wrap: wrap;
  margin-top: .75rem;
}

.answer-actions {
  display: none;
}

.answer-actions.show {
  display: flex;
}

.flash-score {
  text-align: center;
  color: var(--muted);
  margin-top: 1rem;
}

.flash-finished {
  max-width: 520px;
  margin: 1.5rem auto;
  text-align: center;
}

.flash-finished-icon {
  width: 86px;
  height: 86px;
  display: grid;
  place-items: center;
  margin: .25rem auto 1rem;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--yuzu), var(--sakura));
  color: #fff;
  font-size: 2.6rem;
  font-weight: 900;
  box-shadow: 0 12px 28px rgba(233, 138, 165, .28);
}

@media (max-width: 640px) {
  .flash-head {
    align-items: start;
  }

  .flash-settings {
    grid-template-columns: 1fr;
  }

  .flashcard {
    width: min(360px, 100%);
    height: 500px;
    min-height: 420px;
  }

  .flashcard-bottom {
    padding: 1.35rem;
  }

  .flash-word {
    font-size: clamp(2rem, 16vw, 3.8rem);
  }
}

@media (max-width: 400px) {
  .segmented {
    border-radius: 1.1rem;
    flex-direction: column;
  }

  .segmented button {
    width: 100%;
  }

  .flashcard {
    height: 460px;
    min-height: 400px;
  }
}
    
/* === Hintergrund: reduzierter, kühler Sakura-Look === */

body {
  /* etwas kälteres, saubereres Weiß */
  background:
    /* wenige rosa Kreise statt vieler bunter Kreise */
    radial-gradient(circle at 9% 10%,
      rgba(245, 169, 191, 0.26) 0 7.2rem,
      transparent 7.6rem
    ),
    radial-gradient(circle at 88% 8%,
      rgba(255, 196, 211, 0.22) 0 8rem,
      transparent 8.4rem
    ),
    radial-gradient(circle at 76% 88%,
      rgba(245, 169, 191, 0.14) 0 10rem,
      transparent 10.5rem
    ),
    linear-gradient(145deg,
      #ffffff 0%,
      #fbfdff 42%,
      #f3fafc 100%
    );
  background-attachment: fixed;
}

/* zweite Hintergrundebene stark reduzieren */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;

  background:
    radial-gradient(circle at 18% 78%,
      rgba(255, 205, 216, 0.13) 0 11rem,
      transparent 11.5rem
    ),
    radial-gradient(circle at 92% 42%,
      rgba(245, 169, 191, 0.11) 0 12rem,
      transparent 12.6rem
    ),
    linear-gradient(120deg,
      transparent 0 58%,
      rgba(255, 255, 255, 0.34) 58% 58.8%,
      transparent 59%
    );
}

/* Falls vorher ein body::after für Sakura-Motive eingefügt wurde */
body::after {
  display: none;
}

/* kühleres Weiß für Flächen, aber nur dezent */
:root {
  --bg-dark: #fbfdff;
  --bg-light: #ffffff;
  --paper: rgba(255, 255, 255, 0.84);
  --paper-strong: rgba(255, 255, 255, 0.96);
}

/* Karten behalten den Look, aber der Schimmer wird weniger gelb/beige */
.card::before {
  background:
    radial-gradient(circle at 100% 0%,
      rgba(245, 169, 191, 0.13),
      transparent 7rem
    ),
    radial-gradient(circle at 0% 100%,
      rgba(255, 205, 216, 0.10),
      transparent 7rem
    );
}

/* Navbar etwas kühler und klarer */
nav {
  background: rgba(255, 255, 255, 0.62);
  border-color: rgba(245, 169, 191, 0.22);
}

/* Mobile Navbar passend angleichen */
@media (max-width: 600px) {
  nav {
    background: rgba(255, 255, 255, 0.96);
    border-color: rgba(245, 169, 191, 0.24);
  }
}

/* === Chat-Design: helle Sakura-Sprechblasen === */

/* Chat-Karte allgemein */
#chatBox {
  min-height: 240px;
  padding: .35rem .15rem;
  color: var(--ink);
}

/* Die große Chat-Card weicher und heller */
.card:has(#chatBox) {
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(245, 169, 191, 0.24);
  box-shadow: 0 18px 42px rgba(105, 128, 138, 0.14);
}

/* NPC-Bubble links */
#chatBox > div:first-child > div[style*="background:#333"],
#chatBox > div:first-child > div[style*="background: #333"] {
  background:
    linear-gradient(135deg, rgba(255, 255, 255, .96), rgba(255, 246, 249, .94)) !important;
  color: #24404b !important;
  border: 1px solid rgba(245, 169, 191, .28) !important;
  border-radius: 1.25rem 1.25rem 1.25rem .35rem !important;
  box-shadow: 0 12px 26px rgba(105, 128, 138, .12) !important;
  font-weight: 750 !important;
}

/* Romaji/Übersetzungs-Button */
#npcHintToggle {
  color: #9b5c6d !important;
  background: rgba(255, 255, 255, .78) !important;
  border: 1px solid rgba(245, 169, 191, .20) !important;
  border-radius: 999px !important;
  padding: .42rem .72rem !important;
  font-weight: 750 !important;
  box-shadow: 0 8px 20px rgba(105, 128, 138, .10) !important;
}

#npcHintToggle:hover {
  background: rgba(255, 247, 250, .96) !important;
  border-color: rgba(245, 169, 191, .36) !important;
  transform: translateY(-1px);
}

/* Romaji/Deutsch-Infobox */
#npcHintBox {
  color: #45616c !important;
  background: rgba(255, 255, 255, .84) !important;
  border: 1px solid rgba(245, 169, 191, .22) !important;
  border-left: 4px solid rgba(245, 169, 191, .7) !important;
  border-radius: 1rem !important;
  padding: .65rem .8rem !important;
  box-shadow: 0 10px 24px rgba(105, 128, 138, .10) !important;
}

/* Antwortbereich */
#optBox {
  gap: .6rem !important;
  margin-top: 1.35rem !important;
}

/* Antwort-Bubbles rechts */
#optBox .optBtn {
  background:
    linear-gradient(135deg, rgba(255, 247, 250, .98), rgba(246, 253, 255, .94)) !important;
  color: #24404b !important;
  border: 1px solid rgba(85, 185, 199, .22) !important;
  border-radius: 1.25rem 1.25rem .35rem 1.25rem !important;
  padding: .62rem .9rem !important;
  max-width: 80% !important;
  text-align: right !important;
  font-weight: 750 !important;
  line-height: 1.35 !important;
  box-shadow: 0 12px 26px rgba(105, 128, 138, .12) !important;
}

#optBox .optBtn:hover {
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 1), rgba(255, 244, 248, .96)) !important;
  border-color: rgba(245, 169, 191, .36) !important;
  transform: translateY(-1px);
}

/* Audio-Buttons neben Antworten */
#optBox .optAudioBtn {
  background: rgba(255, 255, 255, .88) !important;
  color: #52777f !important;
  border: 1px solid rgba(85, 185, 199, .22) !important;
  border-radius: 999px !important;
  min-width: 44px !important;
  min-height: 44px !important;
  padding: .35rem .55rem !important;
  box-shadow: 0 10px 22px rgba(105, 128, 138, .12) !important;
}

#optBox .optAudioBtn:hover {
  background: rgba(246, 253, 255, .98) !important;
  border-color: rgba(85, 185, 199, .36) !important;
}

/* Falsch markierte Antwort */
#optBox .optBtn[style*="5a2a2a"],
#optBox .optBtn[style*="rgb(90, 42, 42)"] {
  background: linear-gradient(135deg, #fff1f0, #ffe6e4) !important;
  color: #b44444 !important;
  border-color: rgba(220, 105, 105, .38) !important;
}

/* Richtig markierte Antwort */
#optBox .optBtn[style*="2d5a2d"],
#optBox .optBtn[style*="rgb(45, 90, 45)"] {
  background: linear-gradient(135deg, #ecf8ef, #dcf3e2) !important;
  color: #2f6f47 !important;
  border-color: rgba(127, 182, 133, .45) !important;
}

/* Deaktivierte Optionen */
#optBox .optBtn:disabled {
  opacity: .72;
  cursor: default;
}

/* Sprechbereich unten */
#speechArea {
  margin-top: 1.2rem !important;
  border-top: 1px dashed rgba(106, 126, 136, .28) !important;
  padding-top: 1rem !important;
}

/* Aufnahmebutton */
#chatRecordBtn {
  background:
    linear-gradient(135deg, #ff9478, #f5a9bf) !important;
  color: #fff !important;
  border: none !important;
  border-radius: 999px !important;
  padding: .62rem 1rem !important;
  font-weight: 850 !important;
  box-shadow: 0 12px 26px rgba(245, 169, 191, .28) !important;
}

#chatRecordBtn:hover {
  filter: saturate(1.05) brightness(1.02);
  transform: translateY(-1px);
}

/* Aufnahme aktiv */
#chatRecordBtn.recording {
  background: linear-gradient(135deg, #d94a4a, #f07a7a) !important;
  color: #fff !important;
  border-color: transparent !important;
  box-shadow: 0 0 18px rgba(217, 74, 74, .34) !important;
}

/* Aufnahme-Hinweise */
#chatRecLabel,
#chatRecResult,
#speechArea .hint {
  color: #6e7c85 !important;
}

/* Button: Kann gerade nicht sprechen */
#chatSkipSpeechBtn {
  background: rgba(255, 255, 255, .86) !important;
  color: #24404b !important;
  border: 1px solid rgba(245, 169, 191, .24) !important;
  border-radius: 999px !important;
  font-weight: 800 !important;
  box-shadow: 0 8px 20px rgba(105, 128, 138, .10) !important;
}

#chatSkipSpeechBtn:hover {
  background: rgba(255, 247, 250, .96) !important;
  border-color: rgba(245, 169, 191, .38) !important;
}

/* Übersetzung nach richtiger Antwort */
#chatBox > div:not(#optBox):not(:first-child) {
  color: #45616c;
}

/* Weiter-Button im Chat */
#chatNextBtn {
  background: linear-gradient(135deg, #55b9c7, #7fb685) !important;
  color: #fff !important;
  box-shadow: 0 12px 26px rgba(85, 185, 199, .24) !important;
}

/* Mobile: Bubbles etwas breiter und luftiger */
@media (max-width: 600px) {
  #optBox .optBtn {
    max-width: 88% !important;
    font-size: .95rem !important;
  }

  #chatBox > div:first-child > div[style*="background:#333"],
  #chatBox > div:first-child > div[style*="background: #333"] {
    max-width: 88% !important;
  }

  #speechArea > div {
    gap: .6rem !important;
  }
}

/* === Flashcard: Wortgröße automatisch passend machen === */

.flashcard-bottom {
  min-width: 0;
  overflow: hidden;
}

.flash-word {
  display: block;
  width: 100%;
  max-width: calc(100% - .5rem);
  margin: 0 auto;

  text-align: center;
  font-size: 3rem; /* Fallback, wird per JS überschrieben */
  font-weight: 850;
  line-height: 1.06;
  letter-spacing: -.03em;

  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;

  text-shadow: 0 8px 20px rgba(96, 60, 70, .18);
}

/* Überschreibt deine alte Mobile-Regel */
@media (max-width: 640px) {
  .flash-word {
    font-size: 3rem;
  }
}

/* === Mobile Flashcards: größere Begriffe === */

@media (max-width: 640px) {
  .flashcard {
    width: min(390px, calc(100vw - 1.4rem));
    height: min(540px, calc(100svh - 8.5rem));
    min-height: 470px;
    margin-top: .7rem;
    margin-bottom: .8rem;
  }

  .flashcard-face {
    grid-template-rows: 38% 62%;
  }

  .flashcard-bottom {
    padding: 1.15rem;
    gap: .5rem;
  }

  .flash-word {
    font-size: 4rem;
    line-height: 1.02;
    max-width: 100%;
  }

  .flash-label {
    font-size: .75rem;
  }

  .flash-tap {
    font-size: .82rem;
  }
}

@media (max-width: 400px) {
  .flashcard {
    width: min(370px, calc(100vw - 1rem));
    height: min(515px, calc(100svh - 8rem));
    min-height: 450px;
  }

  .flash-word {
    font-size: 3.75rem;
  }
}
/* === Mobile Navbar: wirklich komplett ausblenden, wenn geschlossen === */

@media (max-width: 600px) {
  body {
    padding-top: calc(3.25rem + env(safe-area-inset-top));
  }

  .nav-toggle {
    display: inline-flex;
    z-index: 3000;
  }

  nav {
    z-index: 2500;
    overflow: hidden;
    transition:
      max-height .24s ease,
      opacity .18s ease,
      transform .18s ease,
      padding .18s ease,
      border-width .18s ease;
  }

  body:not(.nav-open) nav {
    max-height: 0 !important;

    padding-top: 0 !important;
    padding-bottom: 0 !important;
    border-width: 0 !important;
    box-shadow: none !important;

    opacity: 0 !important;
    pointer-events: none !important;
    transform: translateY(-8px);
  }

  body.nav-open nav {
    max-height: min(72svh, 430px) !important;

    padding-top: .7rem !important;
    padding-bottom: .7rem !important;
    border-width: 1px !important;

    opacity: 1 !important;
    pointer-events: auto !important;
    transform: translateY(0);
    overflow-y: auto;
  }
}

/* === Uhrenspiel: Zeiten lernen === */

.clock-game {
  max-width: 820px;
  margin: 0 auto;
}

.clock-game-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}

.clock-score {
  padding: .45rem .8rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, .78);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
  font-weight: 850;
  color: #31515c;
}

.clock-stage {
  display: grid;
  place-items: center;
  padding: 1.25rem;
}

.clock-svg {
  width: min(310px, 82vw);
  height: auto;
  display: block;
  filter: drop-shadow(0 18px 28px rgba(96, 129, 141, .16));
}

.clock-face-bg {
  fill: rgba(255, 255, 255, .94);
  stroke: rgba(245, 169, 191, .45);
  stroke-width: 4;
}

.clock-center {
  fill: #24404b;
}

.clock-number {
  font-size: 15px;
  font-weight: 850;
  fill: #31515c;
  text-anchor: middle;
  dominant-baseline: middle;
}

.clock-tick {
  stroke: rgba(49, 81, 92, .45);
  stroke-width: 2;
  stroke-linecap: round;
}

.clock-tick.big {
  stroke: rgba(49, 81, 92, .78);
  stroke-width: 3;
}

.clock-hand-hour {
  stroke: #24404b;
  stroke-width: 8;
  stroke-linecap: round;
}

.clock-hand-minute {
  stroke: #e98aa5;
  stroke-width: 5;
  stroke-linecap: round;
}

.clock-options {
  display: grid;
  gap: .7rem;
  margin-top: 1rem;
}

.clock-answer-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: .55rem;
  align-items: stretch;
}

.clock-answer {
  width: 100%;
  border-radius: 1.25rem;
  text-align: left;
  justify-content: flex-start;
  background:
    linear-gradient(135deg, rgba(255, 247, 250, .98), rgba(246, 253, 255, .94));
  border: 1px solid rgba(85, 185, 199, .22);
  font-size: 1.05rem;
  line-height: 1.35;
}

.clock-answer:hover {
  border-color: rgba(245, 169, 191, .42);
}

.clock-answer.correct {
  background: linear-gradient(135deg, #ecf8ef, #dcf3e2);
  color: #2f6f47;
  border-color: rgba(127, 182, 133, .55);
}

.clock-answer.wrong {
  background: linear-gradient(135deg, #fff1f0, #ffe6e4);
  color: #b44444;
  border-color: rgba(220, 105, 105, .45);
}

.clock-audio {
  min-width: 52px;
  padding-inline: .75rem;
  border-radius: 1.25rem;
}

.clock-feedback {
  min-height: 1.6rem;
  margin-top: .85rem;
  text-align: center;
  font-weight: 850;
}

.clock-feedback.ok {
  color: #2f6f47;
}

.clock-feedback.bad {
  color: #b44444;
}

.clock-bottom-actions {
  display: flex;
  justify-content: center;
  gap: .6rem;
  flex-wrap: wrap;
  margin-top: 1rem;
}

@media (max-width: 520px) {
  .clock-game-head {
    align-items: start;
    flex-direction: column;
  }

  .clock-answer-row {
    grid-template-columns: 1fr;
  }

  .clock-audio {
    width: 100%;
  }
}

}

.menu-game-head {

.menu-options {

// Helper: Übungen an geladene Grammatik anhängen
function applyGrammarExercises(items){
  if (!Array.isArray(items)) return [];
  const map = {};
  items.forEach(g => { map[String(g.id)] = g; });

  function attach(exMap){
    if (!exMap) return;
    Object.keys(exMap).forEach(id => {
      const g = map[id];
      if (!g) return;
      const extra = exMap[id];
      if (!Array.isArray(extra) || !extra.length) return;
      if (!Array.isArray(g.exercises)) g.exercises = [];
      g.exercises = g.exercises.concat(extra);
    });
  }

  attach(GRAMMAR_EXERCISES_GENKI_0);
  attach(GRAMMAR_EXERCISES_GENKI_1);
  attach(GRAMMAR_EXERCISES_GENKI_2);

  return items;
}


// sanft exponentiell ↑ : 1→20, 2→30, 3→50 … 50→~1000, 100→~2000
function tasksRequired(level){
  // 3 fehlerfreie Aufgaben auf Stufe 1, langsam steigend, maximal 8
  return Math.min(8, 3 + Math.floor((Math.max(1, level) - 1) / 4));
}

function loadLevels(){
  try { return JSON.parse(localStorage.getItem(LEVELS_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveLevels(arr){
  localStorage.setItem(LEVELS_KEY, JSON.stringify(arr || []));
}

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{"currentLevel":1,"levelProgress":0,"completedLevels":[]}'); }
  catch(e){ return { currentLevel: 1, levelProgress: 0, completedLevels: [] }; }
}
function saveProgress(p){ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p||{})); }

  const existing = Array.isArray(loadLevels()) ? loadLevels() : [];
  const byId = new Map(existing.map(l => [l.id, l]));

  // 2) Helper: bessere Daten übernehmen
  const takeRicher = (curr, seed) => {
    const out = { ...curr };

    // Titel: wenn leer/gleich "Thema X", nimm den Seed-Titel
    if (!out.title || /^Thema\s+\d+$/i.test(out.title)) out.title = seed.title || out.title;

    // Story-Text: nimm den längeren/nicht-leeren
    const len = s => (typeof s === "string" ? s.trim().length : 0);
    if (len(seed.story_ja) > len(out.story_ja)) out.story_ja = seed.story_ja;
    if (len(seed.story_de) > len(out.story_de)) out.story_de = seed.story_de;

    // Vokabeln: wenn Seed mehr Einträge hat, nimm Seed
    const seedV = Array.isArray(seed.vocab) ? seed.vocab : [];
    const currV = Array.isArray(out.vocab) ? out.vocab : [];
    if (seedV.length > currV.length) out.vocab = seedV;

    // tasksRequired & level & id beibehalten
    out.level = typeof out.level === "number" ? out.level : seed.level;
    out.id    = out.id || seed.id;
    // immer neu berechnen, damit gespeicherte Altwerte (z.B. 21 / 108) ersetzt werden

  return [eng, jsMatch, jpSet];
}

  });
  if (changed) save();
}

// Macht japanischen Text klickbar und verbindet ihn mit Story-Vokabeln
function buildJaWithVocab(textJa, vocab, furi) {
  if (!textJa) return "";

  const safeVocab = Array.isArray(vocab) ? vocab : [];

  // Längere Einträge zuerst, damit 今日 vor 日 matcht etc.
  const vocabEntries = safeVocab
    .map(v => ({
      de: v.de || "",
      kana: v.kana || "",
      kanji: v.kanji || "",
      romaji: v.romaji || ""
    }))
    .sort((a, b) => {
      const lenA = Math.max(a.kana.length, a.kanji.length, a.romaji.length);
      const lenB = Math.max(b.kana.length, b.kanji.length, b.romaji.length);
      return lenB - lenA;
    });

  let html = "";
  let i = 0;
  let plain = "";   // zusammenhängender Text zwischen Vokabel-Treffern
  const flush = () => {
    if (!plain) return;
    html += furi ? furiAnnotate(plain).html : escapeHTML(plain);
    plain = "";
  };

  while (i < textJa.length) {
    let matched = null;
    let matchedLen = 0;

    for (const v of vocabEntries) {
      const candList = [v.kana, v.kanji].filter(Boolean);
      for (const cand of candList) {
        if (!cand) continue;
        if (textJa.startsWith(cand, i)) {
          if (cand.length > matchedLen) {
            matched = { v, cand };
            matchedLen = cand.length;
          }
        }
      }
    }

    if (matched && matchedLen > 0) {
      const surface = matched.cand;
      const reading = matched.v.kana || matched.v.kanji || matched.v.romaji || "";
      const de = matched.v.de || "";

      flush();
      html += `<span class="vocab-token" data-de="${escapeHTML(de)}" data-reading="${escapeHTML(reading)}">${furi ? furiAnnotate(surface).html : escapeHTML(surface)}</span>`;
      i += matchedLen;
    } else {
      // Andere Zeichen normal ausgeben (ohne Tooltip)
      plain += textJa[i];
      i++;
    }
  }
  flush();

  return html;
}

// Aktiviert das Klick-Verhalten auf .vocab-token in einem gegebenen Container
function attachVocabClickHandlers(root) {
  if (!root) return;
  const infoBox = root.querySelector(".vocab-info");
  if (!infoBox) return;

  root.querySelectorAll(".vocab-token").forEach(span => {
    span.addEventListener("click", () => {
      const de = span.getAttribute("data-de") || "";
      const reading = span.getAttribute("data-reading") || "";

      if (!de && !reading) {
        infoBox.textContent = "";
        return;
      }

      infoBox.textContent = reading
        ? `${reading} – ${de}`
        : de;
    });
  });
}

function renderGrammarPractice(mount, id){
  const items = loadGrammar();
  const g = items.find(x => String(x.id) === String(id));

  if (!g){
    mount.innerHTML = "<p>Nicht gefunden.</p>";
    return;
  }

  // Antwortreihenfolge mischen, wenn die richtige Antwort als Text hinterlegt ist
  const exercises = (Array.isArray(g.exercises) ? g.exercises : []).map(ex =>
    (Array.isArray(ex.options) && typeof ex.correctIndex !== "number" && typeof ex.correct_index !== "number")
      ? { ...ex, options: shuffle(ex.options) } : ex);
  if (!exercises.length){
    mount.innerHTML = `
      <h2>${escapeHTML(g.title || "Grammatik")}</h2>
      <div class="card">
        <p>Für diesen Eintrag sind noch keine Übungen hinterlegt.</p>
      </div>
      <div class="actions">
        <button onclick="goto('grammar/view/${encodeURIComponent(String(id))}')">Zurück zur Erklärung</button>
      </div>
    `;
    return;
  }

  let i = 0;
  let correct = 0;
  let wrong = 0;

  function norm(s){
    return String(s || "").trim().toLowerCase();
  }

  function renderStep(feedback){
    const ex = exercises[i];
    const total = exercises.length;
    const hasOptions = Array.isArray(ex.options) && ex.options.length > 0;

    mount.innerHTML = `
      <h2>Übung ${i+1} / ${total}: ${escapeHTML(g.title || "")}</h2>
      <div class="card">
        ${ex.prompt_de ? `<p><strong>Aufgabe:</strong> ${escapeHTML(ex.prompt_de)}</p>` : ""}
        ${ex.prompt_ja ? `<p>${escapeHTML(ex.prompt_ja)}</p>` : ""}

        ${ex.question_de && !ex.prompt_de ? `<p><strong>Aufgabe:</strong> ${escapeHTML(ex.question_de)}</p>` : ""}
        ${ex.question_ja && !ex.prompt_ja ? `<p>${escapeHTML(ex.question_ja)}</p>` : ""}

        ${hasOptions ? `
          <div id="gOpts" style="margin-top:.5rem;"></div>
        ` : `
          <div style="margin-top:.5rem;">
            <label>Lösung eingeben</label>
            <input id="gAnswer" autocomplete="off" />
            <button id="gCheckBtn">Prüfen</button>
          </div>
        `}
        <div id="gFeedback" class="${feedback ? "hint" : ""}" style="margin-top:.75rem;">
          ${feedback || ""}
        </div>
      </div>
      <div class="actions">
        <button id="gBack">${i === 0 ? "Abbrechen" : "Zurück"}</button>
        <button id="gNext"${hasOptions ? ' disabled style="opacity:.6;"' : ""}>
          ${i === total-1 ? "Fertig" : "Weiter"}
        </button>
      </div>
      <p style="margin-top:.5rem;">Richtig: ${correct}, Falsch: ${wrong}</p>
    `;

    const backBtn = document.getElementById("gBack");
    const nextBtn = document.getElementById("gNext");
    const fbEl = document.getElementById("gFeedback");

    backBtn.onclick = () => {
      if (i === 0){
        goto('grammar/view/' + encodeURIComponent(String(id)));
      } else {
        i--;
        renderStep("");
      }
    };

    function finishRound(){
      if (i < total - 1){
        i++;
        renderStep("");
      } else {
        const flawless = (wrong === 0);
        if (flawless){
          try { addProgressIfFlawless(1); } catch(e){}
        }
        const pct = Math.round(100 * correct / total);
        const passed = g.seed ? markGrammarResult(g.id, pct) : false;
        const nextG = g.seed ? GRAMMAR_SEED[(g.order || 0)] : null;   // order ist 1-basiert, also Index der nächsten Lektion
        mount.innerHTML = `
          <h2>Übungen zu: ${escapeHTML(g.title || "")}</h2>
          <div class="card">
            <p>Richtig: ${correct} / ${total} (${pct} %)</p>
            <p>Falsch: ${wrong}</p>
            ${g.seed ? (pct >= PASS_PCT
              ? `<p><span class="badge">Bestanden</span> Lektion abgeschlossen.</p>`
              : `<p><span class="badge">Noch nicht bestanden</span> Du brauchst mindestens ${PASS_PCT} %. Lies die Erklärung noch einmal und versuche es erneut.</p>`) : ""}
          </div>
          <div class="actions">
            ${passed && nextG ? `<button class="primary" onclick="goto('grammar/view/${encodeURIComponent(nextG.id)}')">Nächste Lektion</button>` : ""}
            <button${passed && nextG ? "" : ' class="primary"'} onclick="goto('grammar/practice/${encodeURIComponent(String(id))}')">Nochmal</button>
            <button onclick="goto('grammar/view/${encodeURIComponent(String(id))}')">Zurück zur Erklärung</button>
          </div>
        `;
      }
    }

    if (hasOptions){
      const gOpts = document.getElementById("gOpts");

      const correctIndex =
        (typeof ex.correctIndex === "number" ? ex.correctIndex :
        (typeof ex.correct_index === "number" ? ex.correct_index : null));
      const correctText = ex.correctText || ex.correct || ex.answer;

      ex.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => {
          let isCorrect = false;

          if (correctIndex !== null){
            isCorrect = (idx === correctIndex);
          } else if (correctText != null){
            isCorrect = norm(opt) === norm(correctText);
          }

          if (isCorrect){
            correct++;
            fbEl.textContent = "✓ Richtig!";
          } else {
            wrong++;
            fbEl.textContent = "✗ Nicht ganz." + (ex.explanation_de ? " " + ex.explanation_de : "");
          }

          [...gOpts.querySelectorAll("button")].forEach(b => b.disabled = true);
          if (nextBtn){
            nextBtn.disabled = false;
            nextBtn.style.opacity = "1";
          }
        };
        gOpts.appendChild(btn);
      });

      if (nextBtn){
        nextBtn.onclick = () => finishRound();
      }
    } else {
      const inp = document.getElementById("gAnswer");
      const chk = document.getElementById("gCheckBtn");
      const correctText = ex.answer || ex.correct || ex.solution || "";
      const explanation = ex.explanation_de || "";

      function check(){
        const val = inp.value;
        if (!val.trim()) return;

        const ok = correctText ? norm(val) === norm(correctText) : false;

        if (ok){
          correct++;
          fbEl.textContent = "✓ Richtig!";
        } else {
          wrong++;
          fbEl.textContent = "✗ Nicht ganz." +
            (correctText ? " Erwartet: " + correctText : "") +
            (explanation ? " " + explanation : "");
        }

        inp.disabled = true;
        chk.disabled = true;
        if (nextBtn) nextBtn.disabled = false;
      }

      chk.onclick = check;
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      if (nextBtn){
        nextBtn.disabled = true;
        nextBtn.onclick = () => finishRound();
      }
      if (inp) inp.focus();
    }
  }

  renderStep("");
}

function getFlashWordStartSize(text, areaWidth) {
  const str = String(text || "").trim();
  const len = [...str].length;
  const hasLatin = /[A-Za-zÄÖÜäöüß]/.test(str);

  let size;

  if (hasLatin) {
    if (len <= 4) size = 78;
    else if (len <= 8) size = 68;
    else if (len <= 12) size = 58;
    else if (len <= 18) size = 48;
    else if (len <= 26) size = 38;
    else size = 30;
  } else {
    if (len <= 1) size = 96;
    else if (len <= 2) size = 90;
    else if (len <= 4) size = 82;
    else if (len <= 6) size = 70;
    else if (len <= 9) size = 58;
    else if (len <= 14) size = 46;
    else if (len <= 22) size = 36;
    else size = 30;
  }

  /*
    Vorher war die Schrift auf Mobile zu stark an die Breite gekoppelt.
    Jetzt darf sie auf Handy größer werden, schrumpft aber weiterhin,
    falls sie wirklich nicht passt.
  */
  const widthLimit = areaWidth < 390
    ? areaWidth * 0.24
    : areaWidth * 0.21;

  return Math.min(size, Math.floor(widthLimit));
}

function fitFlashWords(root = document) {
  const words = root.querySelectorAll(".flash-word");
  if (!words.length) return;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      words.forEach(word => {
        const area = word.closest(".flashcard-bottom");
        if (!area) return;

        const text = word.textContent || "";
        const areaStyle = getComputedStyle(area);

        const paddingX =
          parseFloat(areaStyle.paddingLeft || 0) +
          parseFloat(areaStyle.paddingRight || 0);

        const paddingY =
          parseFloat(areaStyle.paddingTop || 0) +
          parseFloat(areaStyle.paddingBottom || 0);

        const tap = area.querySelector(".flash-tap");

        const maxWidth = Math.max(120, area.clientWidth - paddingX - 16);
        const maxHeight = Math.max(
          70,
          area.clientHeight - paddingY - (tap ? tap.offsetHeight + 22 : 0)
        );

        let size = getFlashWordStartSize(text, area.clientWidth);
        const minSize = 18;

        word.style.maxWidth = maxWidth + "px";
        word.style.fontSize = size + "px";
        word.style.lineHeight = "1.06";

        let guard = 80;

        while (
          guard > 0 &&
          size > minSize &&
          (word.scrollWidth > maxWidth || word.scrollHeight > maxHeight)
        ) {
          size -= 2;
          word.style.fontSize = size + "px";
          guard--;
        }
      });
    });
  });
}

if (!window.__flashWordsResizeBound) {

  const learnState = {

    direction: "foreign",  // "foreign" = Fremdsprache zuerst, "de" = Deutsch zuerst
    i: 0,
    flipped: false,
    known: 0,
    wrong: 0,
    cards: []
  };

  function cleanGermanQuestion(q) {
  return String(q || "")
    .replace(/\s*[–-]\s*\(?\s*(Kana|Kanji|Romaji)\s*\)?\s*$/i, "")
    .trim();
}

function getCardType(q) {
  const str = String(q || "");
  const match = str.match(/[–-]\s*\(?\s*(Kana|Kanji|Romaji)\s*\)?\s*$/i);

  if (!match) return "normal";

  return match[1].toLowerCase();
}

  /*
    Wichtig:
    Diese Funktion baut jetzt NICHT mehr abhängig von Kana/Romaji/Kanji.
    Sie baut einmal feste Wortkarten.
    Jede Karte enthält alle vorhandenen Schreibweisen.
  */
  function buildFlashcards() {
    const grouped = new Map();
    const normalCards = [];

    s.cards.forEach(card => {
      const type = getCardType(card.question);

      if (type === "kana" || type === "romaji" || type === "kanji") {
        const de = cleanGermanQuestion(card.question);

        if (!de) return;

        if (!grouped.has(de)) {
          grouped.set(de, {
            id: de,
            de,
            kana: "",
            romaji: "",
            kanji: "",
            isJapanese: true
          });
        }

        const item = grouped.get(de);
        item[type] = String(card.answer || "").trim();
      } else {
        normalCards.push({
          id: card.id,
          de: card.answer || "",
          foreign: card.question || "",
          kana: "",
          romaji: "",
          kanji: "",
          isJapanese: false
        });
      }
    });

    const japaneseCards = [...grouped.values()]
      .filter(item =>
        item.de &&
        (
          item.kana ||
          item.romaji ||
          item.kanji
        )
      );

    if (japaneseCards.length) {
      return shuffle(japaneseCards);
    }

    return shuffle(normalCards);
  }

  function modeLabel() {
    if (learnState.mode === "romaji") return "Romaji";
    if (learnState.mode === "kanji") return "Kanji";
    return "Kana";
  }

  function missingModeText(mode) {
    if (mode === "kanji") return "Kein Kanji";
    if (mode === "romaji") return "Kein Romaji";
    return "Kein Kana";
  }

  function foreignText(card) {
    if (!card) return "";

    if (!card.isJapanese) {
      return card.foreign || "";
    }

    if (learnState.mode === "romaji") {
      return card.romaji || missingModeText("romaji");
    }

    if (learnState.mode === "kanji") {
      return card.kanji || missingModeText("kanji");
    }

    return card.kana || missingModeText("kana");
  }

  function frontText(card) {
    return learnState.direction === "foreign"
      ? foreignText(card)
      : card.de;
  }

  function backText(card) {
    return learnState.direction === "foreign"
      ? card.de
      : foreignText(card);
  }

  function frontLabel() {
    return learnState.direction === "foreign" ? modeLabel() : "Deutsch";
  }

  function backLabel() {
    return learnState.direction === "foreign" ? "Deutsch" : modeLabel();
  }

  function resetRound() {
    learnState.cards = buildFlashcards();
    learnState.i = 0;
    learnState.flipped = false;
    learnState.known = 0;
    learnState.wrong = 0;
  }

  function updateCardOnly() {
    const cardEl = document.getElementById("flashcard");
    if (!cardEl) return;

    if (learnState.flipped) {
      cardEl.classList.add("is-flipped");
    } else {
      cardEl.classList.remove("is-flipped");
    }
  }

  function refitFlashWords() {
    if (typeof fitFlashWords === "function") {
      fitFlashWords(mount);
    }
  }

  function renderFinished() {
    const total = learnState.cards.length;
    const flawless = learnState.wrong === 0 && learnState.known === total;

    if (flawless) {
      try { addProgressIfFlawless(1); } catch(e) {}
    }

    mount.innerHTML = `
      <h2>Flashcards: ${escapeHTML(s.name)}</h2>

      <div class="flash-finished card">
        <div class="flash-finished-icon">山</div>
        <h3>Runde beendet</h3>
        <p>Gewusst: <strong>${learnState.known}</strong> / ${total}</p>
        <p>Nochmal üben: <strong>${learnState.wrong}</strong></p>
        ${flawless ? `<p class="hint">Perfekt! Fehlerfreie Runde zählt für deinen Level-Fortschritt.</p>` : ""}
      </div>

      <div class="actions flash-actions">
        <button class="primary" id="againBtn">Nochmal lernen</button>

      </div>
    `;

    document.getElementById("againBtn").onclick = () => {
      resetRound();
      redraw();

  }

  function nextCard(wasKnown) {
    if (wasKnown) {

    } else {
      learnState.wrong++;
    }

    if (learnState.i >= learnState.cards.length - 1) {
      renderFinished();
      return;
    }

    learnState.i++;
    learnState.flipped = false;
    redraw();
  }

  function setFlashMode(mode) {
    if (learnState.mode === mode) return;

    /*
      Wichtig:
      Hier KEIN resetRound().
      Dadurch bleibt dieselbe Karte aktiv.
      Nur die Schreibweise wird gewechselt.

    learnState.mode = mode;
    redraw();
  }

          </div>
        </div>

        <div class="flash-settings card">
          <div class="flash-setting-group">
            <span>Schrift</span>
            <div class="segmented">
              <button type="button" id="modeKana" class="${learnState.mode === "kana" ? "active" : ""}">
                Kana

                Kanji

                Romaji
              </button>
            </div>
          </div>

          <div class="flash-setting-group">

        </div>

        <button id="flashcard" class="flashcard" type="button" aria-label="Flashcard umdrehen">

            <span class="flashcard-face flashcard-front">

              </span>

            <span class="flashcard-face flashcard-back">

        <div class="flash-actions">

            ${learnState.flipped ? "Vorderseite zeigen" : "Antwort zeigen"}
          </button>
        </div>

        <div class="flash-actions answer-actions ${learnState.flipped ? "show" : ""}">
          <button id="wrongBtn" class="danger" type="button">Nochmal üben</button>

    updateCardOnly();
    refitFlashWords();

    document.getElementById("flashcard").onclick = () => {
      learnState.flipped = !learnState.flipped;

      if (flipBtn) {

    document.getElementById("wrongBtn").onclick = () => nextCard(false);

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }

function renderQuiz(mount, setId){
  let hadMistake = false;
  const s = state.sets.find(x => x.id === setId);
  if (!s || s.cards.length < 2) return mount.innerHTML = `<p>Mindestens 2 Karten nötig.</p>`;
  const questions = shuffle(s.cards);
  let i = 0, score = 0;

  // Schriftart einer Antwort: Falschantworten sollen dieselbe Art haben,
  // sonst erkennt man die richtige Antwort allein an der Schrift.
  function scriptKind(t){
    const x = String(t || "");
    if (/[一-鿿]/.test(x)) return "kanji";
    if (/[゠-ヿ]/.test(x)) return "katakana";
    if (/[぀-ゟ]/.test(x)) return "hiragana";
    if (/^[\x00-\x7f]+$/.test(x)) return "latin";
    return "other";
  }
  function makeOptions(correct, allCards){
    const kind = scriptKind(correct.answer);
    const seen = new Set([correct.answer]);
    const others = shuffle(allCards.filter(c => c !== correct));
    const pick = [];
    const take = (list) => {
      for (const c of list){
        if (pick.length >= 3) break;
        if (seen.has(c.answer)) continue;
        seen.add(c.answer);
        pick.push(c.answer);
      }
    };
    take(others.filter(c => scriptKind(c.answer) === kind));
    take(others);
    return shuffle([correct.answer, ...pick]);
  }
  function redraw(){
    const c = questions[i];
    const options = makeOptions(c, s.cards);
    mount.innerHTML = `
      <h2>Quiz: ${s.name}</h2>
      <div class="card">
        <div><strong>Frage ${i+1}/${questions.length}:</strong> ${escapeHTML(c.question)}</div>
        <div id="opts" style="margin-top:.5rem;"></div>
        <div style="margin-top:.5rem;">Punkte: ${score}</div>
      </div>
    `;
    const opts = $("#opts");
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.textContent = opt;
      
      btn.onclick = () => {
        const correct = (opt === c.answer);
        if (correct) { score++; }
        if (i < questions.length-1) {
          i++;
          redraw();
        } else {
          if (score === questions.length) { try { addProgressIfFlawless(1); } catch(e){} }
          mount.innerHTML = `
            <h2>Ergebnis</h2>
            <p>Punkte: ${score} / ${questions.length}</p>
            <div class="actions">
              <button onclick="goto('quiz/${s.id}')">Nochmal</button>
              <button onclick="goto('set/${s.id}')">Zurück</button>
            </div>
          `;
        }
      };

      opts.appendChild(btn);
    });
  }
  redraw();
}

/* -------- Timed Match Mode (60s, 8 sichtbar, 20 insgesamt, -2s) -------- */
function renderMatch(mount, setId){
  const s = state.sets.find(x => x.id === setId);
  if (!s || s.cards.length < 2) return mount.innerHTML = `<p>Zu wenige Karten für Match.</p>`;

  const ROUND_TARGET = Math.min(20, s.cards.length);
  const BOARD_SIZE = Math.min(8, ROUND_TARGET);
  let pool = shuffle(s.cards).slice(0, ROUND_TARGET);
  let board = [];
  let remainingMs = 60000;
  let timer = null;
  let solved = 0, mistakes = 0;

  while (board.length < BOARD_SIZE && pool.length) {
    const c = pool.shift();
    board.push({ id: c.id, q: c.question, a: c.answer });
  }

  function startTimer(){
    timer = setInterval(() => {
      // Ansicht wurde verlassen -> Timer beenden
      if (!document.body.contains(timeEl())) { clearInterval(timer); return; }
      remainingMs -= 1000;
      if (remainingMs <= 0) { remainingMs = 0; clearInterval(timer); finish(); }
      showTime();
    }, 1000);
  }
  function timeEl(){ return $("#time"); }
  function showTime(){
    const el = timeEl();
    if (el) el.textContent = fmtTime(remainingMs);
  }
  function timePenalty(ms){
    remainingMs = Math.max(0, remainingMs - ms);
    if (remainingMs === 0) { clearInterval(timer); finish(); }
    showTime();
  }

  let selectedQ = null, selectedA = null;

  mount.innerHTML = `
    <h2>Match (60s): ${s.name}</h2>
    <div class="card">
      <div>Runde: <strong id="solved">${solved}</strong> / ${ROUND_TARGET}
        &nbsp; | &nbsp; Fehler: <strong id="mistakes">${mistakes}</strong>
        &nbsp; | &nbsp; <span class="timer">Zeit: <strong id="time">${fmtTime(remainingMs)}</strong></span>
      </div>
    </div>
    <div class="match-board">
      <div class="match-col" id="colQ"><h3>Begriffe</h3></div>
      <div class="match-col" id="colA"><h3>Definitionen</h3></div>
    </div>
    <div class="actions" style="margin-top:1rem;">
      <button onclick="goto('match/${s.id}')" title="Neue Runde starten">Neu starten</button>
      <button onclick="goto('set/${s.id}')">Zurück</button>
    </div>
  `;

  function redrawColumns(){
    const qs = shuffle(board.map(b => ({ id: b.id, text: b.q })));
    const as = shuffle(board.map(b => ({ id: b.id, text: b.a })));
    const colQ = $("#colQ"); const colA = $("#colA");
    colQ.innerHTML = "<h3>Begriffe</h3>";
    colA.innerHTML = "<h3>Definitionen</h3>";
    qs.forEach(item => {
      const el = document.createElement("button");
      el.className = "match-item" + ((selectedQ && selectedQ.id) === item.id ? " selected" : "");
      el.textContent = item.text;
      el.onclick = () => { selectedQ = item; checkPair(); redrawColumns(); };
      colQ.appendChild(el);
    });
    as.forEach(item => {
      const el = document.createElement("button");
      el.className = "match-item" + ((selectedA && selectedA.id) === item.id ? " selected" : "");
      el.textContent = item.text;
      el.onclick = () => { selectedA = item; checkPair(); redrawColumns(); };
      colA.appendChild(el);
    });
  }

  function checkPair(){
    if (!selectedQ || !selectedA) return;
    if (selectedQ.id === selectedA.id) { board = board.filter(b => b.id !== selectedQ.id);
      solved++; $("#solved").textContent = solved;
      if (pool.length) {
        const c = pool.shift();
        board.push({ id: c.id, q: c.question, a: c.answer });
      }
    } else {
      mistakes++; $("#mistakes").textContent = mistakes; timePenalty(2000);
    }
    selectedQ = null; selectedA = null;
    if (solved >= ROUND_TARGET) { clearInterval(timer); finish(); }
  }

  function finish(){
    if (solved >= ROUND_TARGET && mistakes === 0) { try { addProgressIfFlawless(1); } catch(e){} }
$("#app").innerHTML = `
      <h2>Ergebnis – Match</h2>
      <div class="card">
        <p>Gelöst: <strong>${solved}</strong> / ${ROUND_TARGET}</p>
        <p>Fehler: <strong>${mistakes}</strong></p>
        <p>Verbrauchte Zeit: <strong>${fmtTime(60000 - remainingMs)}</strong></p>
      </div>
      <div class="actions">
        <button class="primary" onclick="goto('match/${s.id}')">Nochmal</button>
        <button onclick="goto('set/${s.id}')">Zum Set</button>
        <button onclick="goto('home')">Start</button>
      </div>
    `;
  }

  function fmtTime(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const mm = String(Math.floor(s/60)).padStart(2,"0");
    const ss = String(s%60).padStart(2,"0");
    return `${mm}:${ss}`;
  }

  redrawColumns();
  startTimer();
}

function renderClockGame(mount) {
  const CLOCK_MINUTE_STEP = 5;
  // Für wirklich jede Minute auf 1 setzen:
  // const CLOCK_MINUTE_STEP = 1;

  const game = {
    score: 0,
    rounds: 0,
    current: null,
    locked: false,
    selectedIndex: null,
    feedback: ""
  };

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function timeKey(t) {
    return `${t.hour}:${String(t.minute).padStart(2, "0")}`;
  }

  function randomTime() {
    const hour = randInt(1, 12);
    const minuteSlots = Math.floor(60 / CLOCK_MINUTE_STEP);
    const minute = randInt(0, minuteSlots - 1) * CLOCK_MINUTE_STEP;

    return { hour, minute };
  }

  function makeNewQuestion() {
    const correct = randomTime();
    const used = new Set([timeKey(correct)]);
    const options = [{
  ...correct,
  ...timeToJapaneseParts(correct.hour, correct.minute),
  correct: true
}];

    while (options.length < 3) {
      const wrong = randomTime();
      const key = timeKey(wrong);

      if (used.has(key)) continue;

      used.add(key);
     options.push({
  ...wrong,
  ...timeToJapaneseParts(wrong.hour, wrong.minute),
  correct: false
});
    }

    game.current = {
      time: correct,
      options: shuffle(options)
    };

    game.locked = false;
    game.selectedIndex = null;
    game.feedback = "";
  }

function hourToKana(hour) {

}

function timeToJapaneseParts(hour, minute) {
  const hKana = hourToKana(hour);
  const hKanji = hourToKanji(hour);

  const mKana = minuteToKana(minute);
  const mKanji = minuteToKanji(minute);

  if (minute === 0) {
    return {
      label: `今は${hKanji}時です。`,
      speech: `いまは ${hKana}じです。`
    };
  }

  if (minute === 30) {
    return {
      label: `今は${hKanji}時半です。`,
      speech: `いまは ${hKana}じはんです。`
    };
  }

  return {
    label: `今は${hKanji}時${mKanji}です。`,
    speech: `いまは ${hKana}じ${mKana}です。`
  };
}

  function clockSvg(hour, minute) {
    const center = 130;
    const radius = 112;
    const hourAngle = ((hour % 12) * 30) + (minute * 0.5);
    const minuteAngle = minute * 6;

    const ticks = Array.from({ length: 60 }, (_, i) => {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const isBig = i % 5 === 0;
      const outer = radius;
      const inner = isBig ? radius - 13 : radius - 7;

      const x1 = center + Math.cos(angle) * inner;
      const y1 = center + Math.sin(angle) * inner;
      const x2 = center + Math.cos(angle) * outer;
      const y2 = center + Math.sin(angle) * outer;

      return `
        <line
          class="clock-tick ${isBig ? "big" : ""}"
          x1="${x1.toFixed(2)}"
          y1="${y1.toFixed(2)}"
          x2="${x2.toFixed(2)}"
          y2="${y2.toFixed(2)}"
        />
      `;
    }).join("");

    const numbers = Array.from({ length: 12 }, (_, i) => {
      const n = i + 1;
      const angle = (n * 30 - 90) * Math.PI / 180;
      const numberRadius = 88;
      const x = center + Math.cos(angle) * numberRadius;
      const y = center + Math.sin(angle) * numberRadius;

      return `
        <text
          class="clock-number"
          x="${x.toFixed(2)}"
          y="${y.toFixed(2)}"
        >${n}</text>
      `;
    }).join("");

    return `
      <svg class="clock-svg" viewBox="0 0 260 260" role="img" aria-label="Analoge Uhr">
        <circle class="clock-face-bg" cx="130" cy="130" r="120"></circle>

        ${ticks}
        ${numbers}

        <line
          class="clock-hand-hour"
          x1="130"
          y1="130"
          x2="130"
          y2="72"
          transform="rotate(${hourAngle} 130 130)"
        ></line>

        <line
          class="clock-hand-minute"
          x1="130"
          y1="130"
          x2="130"
          y2="42"
          transform="rotate(${minuteAngle} 130 130)"
        ></line>

        <circle class="clock-center" cx="130" cy="130" r="7"></circle>
      </svg>
    `;
  }

  function checkAnswer(index) {
    if (game.locked) return;

    const picked = game.current.options[index];
    game.locked = true;
    game.selectedIndex = index;
    game.rounds++;

    if (picked.correct) {
      game.score++;
      game.feedback = "Richtig!";
    } else {
      const correct = game.current.options.find(o => o.correct);
      game.feedback = `Nicht ganz. Richtig ist: ${correct.label}`;
    }

    redraw();
  }

  function speakJapanese(text) {
    if (!text) return;

    try {
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }

      if (typeof speak === "function") {
        speak(text);
        return;
      }

      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function redraw() {
    const c = game.current;
    const correctAnswer = c.options.find(o => o.correct);
    const feedbackClass = game.feedback === "Richtig!" ? "ok" : "bad";

    mount.innerHTML = `
      <section class="clock-game">
        <div class="clock-game-head">
          <div>
            <h2>Uhrenspiel</h2>
            <p class="hint">Welche Uhrzeit zeigt die Uhr?</p>
          </div>

          <div class="clock-score">
            ${game.score} / ${game.rounds}
          </div>
        </div>

        <div class="card clock-stage">
          ${clockSvg(c.time.hour, c.time.minute)}
        </div>

        <div class="clock-options">
          ${c.options.map((opt, idx) => {
            let cls = "";

            if (game.locked && opt.correct) {
              cls = "correct";
            } else if (game.locked && game.selectedIndex === idx && !opt.correct) {
              cls = "wrong";
            }

            return `
              <div class="clock-answer-row">
                <button
                  type="button"
                  class="clock-answer ${cls}"
                  data-index="${idx}"
                  ${game.locked ? "disabled" : ""}
                >
                  ${escapeHTML(opt.label)}
                </button>

                <button
                  type="button"
                  class="clock-audio"
                  data-index="${idx}"
                  title="Antwort anhören"
                  aria-label="Antwort anhören"
                >
                  🔊
                </button>
              </div>
            `;
          }).join("")}
        </div>

        <div class="clock-feedback ${feedbackClass}">
          ${game.feedback ? escapeHTML(game.feedback) : ""}
        </div>

        <div class="clock-bottom-actions">
          <button id="clockHearCorrect" type="button">
            🔊 Richtige Antwort hören
          </button>

          <button id="clockNextBtn" class="primary" type="button">
            Nächste Uhr
          </button>

          <button onclick="goto('home')" type="button">
            Zurück
          </button>
        </div>
      </section>
    `;

    document.querySelectorAll(".clock-answer").forEach(btn => {
      btn.addEventListener("click", () => {
        checkAnswer(Number(btn.dataset.index));
      });
    });

    document.querySelectorAll(".clock-audio").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.index);
        speakJapanese(c.options[idx].speech);
      });
    });

    document.getElementById("clockHearCorrect").onclick = () => {
      speakJapanese(correctAnswer.speech);
    };

    document.getElementById("clockNextBtn").onclick = () => {
      makeNewQuestion();
      redraw();
    };
  }

  makeNewQuestion();
  redraw();
}
